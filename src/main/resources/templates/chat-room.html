<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title><style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
    }

    /* 전체 채팅 영역 */
    .chat-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      height: 80vh;
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 메시지 영역 */
    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      background: #eaeaea;
    }

    /* 메시지 공통 */
    .msg {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      max-width: 70%;
    }

    /* 상대 메시지 (오른쪽) */
    .msg.other {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.other .bubble {
      background: #ffeb3b;
      color: #000;
      border-radius: 12px 0 12px 12px;
    }

    /* 내 메시지 (왼쪽) */
    .msg.me {
      align-self: flex-start;
    }

    .msg.me .bubble {
      background: #ffffff;
      border-radius: 0 12px 12px 12px;
    }

    /* 말풍선 */
    .bubble {
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    /* 닉네임 */
    .nickname {
      font-size: 12px;
      color: #555;
      margin-bottom: 2px;
    }

    /* 번역 버튼 */
    .translate-btn {
      font-size: 11px;
      padding: 2px 6px;
      margin-top: 2px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
    }

    .translate-btn:hover {
      text-decoration: underline;
    }

    .translate-btn[disabled] {
      color: #aaa;
      cursor: default;
    }

    /* 입력 영역 */
    .input-area {
      display: flex;
      padding: 8px;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    .input-area input {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-right: 6px;
    }

    .input-area button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #ffeb3b;
      cursor: pointer;
    }
</style>

</head>
<body>

<h3>채팅방</h3>
<div class="chat-container">
    <div id="messages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="메시지 입력" />
        <button onclick="sendMessage()">전송</button>
    </div>
</div>
<button onclick="leaveRoom()">나가기</button>


<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script th:inline="javascript">
    const roomId = [[${roomId}]];
  //  로그인 체크 임시제거
   // const accessToken = localStorage.getItem("accessToken");

  //  if (!accessToken) {
   //     alert("로그인이 필요합니다.");
   //     location.href = "/login";
    // }
const params = new URLSearchParams(window.location.search);
const userId = Number(params.get("userId") ?? 1);

const socket = new WebSocket(
  "ws://localhost:8080/ws?userId=" + userId
);
    const stompClient = Stomp.over(socket);
    stompClient.debug = null; // 콘솔 스팸 끄기

<!--    stompClient.connect(-->
<!--        { Authorization: "Bearer " + accessToken },-->
<!--        () => {-->
<!--            // 구독-->
<!--            stompClient.subscribe("/topic/chat/" + roomId, (frame) => {-->
<!--                const data = JSON.parse(frame.body);-->
<!--                appendMessage(data.senderNickname, data.translatedText ?? data.originalText);-->
<!--            });-->
<!--        },-->
<!--        (err) => {-->
<!--            console.error("STOMP ERROR", err);-->
<!--            alert("채팅 서버 연결 실패");-->
<!--        }-->
<!--    );-->

stompClient.connect(
    {},
    () => {
        console.log("CONNECTED");

  // 읽음 처리
  fetch(`/api/chat/rooms/${roomId}/read?userId=${userId}`, {
    method: "POST"
  });
        loadHistory(0);
        stompClient.subscribe("/topic/chat/" + roomId, (frame) => {
            const data = JSON.parse(frame.body);
            console.log("WS MESSAGE =", data);
            appendMessage(
                data
            );
            if (data.senderId !== userId) {
  fetch(`/api/chat/rooms/${roomId}/read?userId=${userId}`, {
    method: "POST"
  });
}
        });
    },
    (err) => {
        console.error("STOMP ERROR", err);
    }
);

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text) return;

        stompClient.send(
            "/app/chat.send/" + roomId,
            {},
            JSON.stringify({ originalText: text })
        );
        input.value = "";
    }


const messageMap = new Map();

function appendMessage(message) {
  let wrapper = messageMap.get(message.messageId);

  if (!wrapper) {
    const isMe = message.senderId === userId;

    wrapper = document.createElement("div");
    wrapper.className = "msg " + (isMe ? "me" : "other");
    wrapper.dataset.messageId = message.messageId;

    // 닉네임 (상대만)
    if (!isMe) {
      const nick = document.createElement("div");
      nick.className = "nickname";
      nick.innerText = message.senderNickname;
      wrapper.appendChild(nick);
    }

    // 말풍선
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    wrapper.appendChild(bubble);

    // 번역 버튼
    const btn = document.createElement("button");
    btn.className = "translate-btn";
    btn.innerText = "번역";
    btn.onclick = () => {
      btn.innerText = "번역중...";
      btn.disabled = true;
      translateMessage(message.messageId);
    };
    wrapper.appendChild(btn);

    document.getElementById("messages").appendChild(wrapper);
    messageMap.set(message.messageId, wrapper);
  }

  // 텍스트 갱신
  const bubble = wrapper.querySelector(".bubble");
  bubble.innerText = message.translatedText || message.originalText;

  // 번역 완료 시 버튼 숨김
  if (message.translatedText) {
    const btn = wrapper.querySelector(".translate-btn");
    if (btn) btn.style.display = "none";
  }

  // 스크롤 유지
  const box = document.getElementById("messages");
  box.scrollTop = box.scrollHeight;
}




    async function loadHistory(page = 0) {
    const res = await fetch(
        `/api/chat/rooms/${roomId}/messages?page=${page}&size=20`
    );
    const data = await res.json();

    // DB에서는 DESC → 화면에서는 ASC
    const messages = data.content.reverse();
    messages.forEach(m => appendMessage(m));
}

  async function leaveRoom() {
  await fetch(`/api/chat/rooms/${roomId}/leave?userId=${userId}`, {
    method: "POST"
  });

  alert("채팅방을 나갔습니다.");
  location.href = "/";



}

    function translateMessage(messageId) {
  const targetLanguage = "ko"; // 나중에 select로 확장 가능

  fetch(`/api/chat/messages/${messageId}/translate?targetLanguage=${targetLanguage}`, {
    method: "POST"
  });
}
</script>

</body>
</html>
