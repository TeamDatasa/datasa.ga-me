<body>

<input id="msg" placeholder="메시지 입력" style="width:70%"/>

<script th:inline="javascript">

const params = new URLSearchParams(window.location.search);
const userId = params.get("userId") ?? 1;

  "ws://localhost:8080/ws?userId=" + userId
);
    const stompClient = Stomp.over(socket);

stompClient.connect(
    {},
    () => {
        console.log("CONNECTED");
        stompClient.subscribe("/topic/chat/" + roomId, (frame) => {
            const data = JSON.parse(frame.body);
            appendMessage(
                data.senderNickname,
                data.translatedText ?? data.originalText
            );
        });
    },
    (err) => {
        console.error("STOMP ERROR", err);
    }
);

    function sendMessage() {
        const input = document.getElementById("msg");
        const text = input.value.trim();
        if (!text) return;

        stompClient.send(
            "/app/chat.send/" + roomId,
            {},
            JSON.stringify({ originalText: text })
        );
        input.value = "";
    }

    function appendMessage(sender, text) {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerText = sender + ": " + text;
        document.getElementById("messages").appendChild(div);
        document.getElementById("messages").scrollTop = 999999;
    }
</script>

</body>
</html>
