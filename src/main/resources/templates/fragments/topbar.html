<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="notifTopbar">
    <div class="notif-wrap" data-notif-wrap>
        <!-- 🔔 종 버튼 -->
        <button type="button" class="notif-icon-btn" data-notif-bell aria-label="알림 열기">
            <span class="notif-icon">🔔</span>
            <span class="notif-badge" data-notif-badge style="display:none;">0</span>
        </button>

        <!-- 팝오버 -->
        <div class="notif-popover" data-notif-popover>
            <div class="notif-popover__header">
                <div class="notif-popover__title">알림</div>
                <button type="button" class="notif-popover__markread" data-notif-markread>
                    모두 읽음
                </button>
            </div>

            <div class="notif-empty" data-notif-empty style="display:none;">
                알림이 없습니다.
            </div>

            <ul class="notif-list" data-notif-list></ul>
        </div>
    </div>
</div>
</body>
</html>
