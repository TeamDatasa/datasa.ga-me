<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 파일: src/main/resources/templates/fragments/topbar.html -->
<div th:fragment="notifTopbar">
    <div class="notif-wrap" data-notif-wrap>
        <!-- 종 버튼 (아이콘 버튼 스타일 통일) -->
        <button type="button" class="yw-icon-btn notif-icon-btn" data-notif-bell aria-label="通知を開く">
            <span class="yw-icon" aria-hidden="true">🔔</span>
            <span class="notif-badge" data-notif-badge style="display:none;">0</span>
        </button>

        <!-- 토스트(즉市 通知) 컨테이너 -->
        <div class="notif-toast-area" data-notif-toast-area></div>

        <!-- 팝오버 -->
        <div class="notif-popover" data-notif-popover>
            <div class="notif-popover__header">
                <div class="notif-popover__title">通知</div>
                <button type="button" class="notif-popover__markread" data-notif-markread>
                    すべて既読
                </button>
            </div>

            <div class="notif-empty" data-notif-empty style="display:none;">
                通知はありません。
            </div>

            <ul class="notif-list" data-notif-list></ul>
        </div>
    </div>
</div>
</body>
</html>
