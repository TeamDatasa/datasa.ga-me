<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="siteHeader">
    <header class="yw-header">
        <div id="loginToast" class="yw-toast" aria-live="polite" aria-atomic="true">
            ログイン 완료!
        </div>

        <div class="yw-container yw-header__inner">
            <a class="yw-logo" href="/">
                <span class="yw-logo__mark">●</span>
                <span class="yw-logo__text">ga-me</span>
            </a>

            <nav class="yw-nav">
                <a class="yw-nav__link" href="/">ホーム</a>
                <a class="yw-nav__link" href="/trip/listAll">旅行</a>
                <a class="yw-nav__link" href="/community">サポート</a>
            </nav>

            <div class="yw-auth">
                <div id="guestMenu">
                    <a class="yw-btn yw-btn--ghost" th:href="@{/login}">ログイン</a>
                    <a class="yw-btn yw-btn--primary" th:href="@{/signup}">会員登録</a>
                </div>

                <div id="userMenu" style="display:none;">
                    <!-- チャット 아이콘(통일된 아이콘 버튼) -->
                    <a class="yw-icon-btn" href="/chat/rooms" aria-label="チャット">
                        <span class="yw-icon" aria-hidden="true">💬</span>
                    </a>

                    <!-- 通知(Topbar fragment) -->
                    <div th:replace="~{fragments/topbar :: notifTopbar}"></div>

                    <a class="yw-btn yw-btn--ghost" th:href="@{/mypage}">マイページ</a>
                    <button class="yw-btn yw-btn--primary" id="logoutBtn" type="button">ログアウト</button>
                </div>
            </div>
        </div>
    </header>
</div>
</body>
</html>
