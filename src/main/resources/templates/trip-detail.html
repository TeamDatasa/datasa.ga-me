<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>여행 상세</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            margin-bottom: 10px;
        }
        .section {
            margin-bottom: 16px;
        }
        .info p {
            margin: 4px 0;
        }
        .lang span {
            margin-right: 6px;
            padding: 2px 8px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 13px;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            font-weight: bold;
        }
        hr {
            margin: 24px 0;
        }
    </style>
</head>
<body>

<h2 id="title">로딩중...</h2>

<div class="section info">
    <p><b>호스트</b> : <span id="hostName"></span></p>
    <p><b>지역</b> : <span id="region"></span></p>
    <p><b>테마</b> : <span id="theme"></span></p>
    <p><b>설명</b> : <span id="description"></span></p>
    <p><b>기간</b> :
        <span id="startAt"></span> ~ <span id="endAt"></span>
    </p>
    <p><b>비용</b> : <span id="estimatedCost"></span> 원</p>
    <p><b>모집 인원</b> :
        <span id="approvedCount"></span> /
        <span id="maxParticipants"></span>
    </p>
</div>

<div class="section lang">
    <b>지원 언어</b><br/>
    <span id="languages"></span>
</div>

<hr/>

<div class="section"  id="application-area">
    <button id="applyBtn">신청하기</button>
    <button id="chatBtn" style="display:none;">채팅방 입장</button>
    <p id="statusText"></p>
</div>

<hr/>

<a href="/trip/mainList">← 목록으로</a>

<script th:inline="javascript">
    const tripId = [[${tripId}]];
    const userId = 1; // 임시 (나중에 로그인 연동)

    let currentTrip = null;

    /* =========================
       상세 정보 로딩
    ========================= */
    function loadTripDetail() {
        fetch(`/api/trips/${tripId}?userId=${userId}`)
            .then(res => res.json())
            .then(trip => {
                currentTrip = trip;

                document.getElementById('title').innerText = trip.title;
                document.getElementById('hostName').innerText = trip.hostName;
                document.getElementById('region').innerText = trip.region;
                document.getElementById('theme').innerText = trip.theme;
                document.getElementById('description').innerText = trip.description;
                document.getElementById('startAt').innerText = trip.startAt;
                document.getElementById('endAt').innerText = trip.endAt;
                document.getElementById('estimatedCost').innerText = trip.estimatedCost;
                document.getElementById('maxParticipants').innerText = trip.maxParticipants;
                document.getElementById('approvedCount').innerText = trip.approvedCount;

                // 언어
                const langEl = document.getElementById('languages');
                langEl.innerHTML = '';
                (trip.languages || []).forEach(lang => {
                    const span = document.createElement('span');
                    span.innerText = lang;
                    langEl.appendChild(span);
                });

                renderApplySection(trip);
            })
            .catch(() => {
                alert('여행 정보를 불러오지 못했습니다.');
            });
    }

    /* =========================
       신청 버튼 제어
    ========================= */
    function renderApplySection(trip) {
        const btn = document.getElementById('applyBtn');
        const statusText = document.getElementById('statusText');

        btn.disabled = false;
        statusText.innerText = '';

        if (trip.approvedCount >= trip.maxParticipants) {
            btn.disabled = true;
            statusText.innerText = '모집이 마감되었습니다.';
            return;
        }

        if (trip.applicationStatus === null) {
            statusText.innerText = '신청 가능합니다.';
            return;
        }

        if (trip.applicationStatus === 'PENDING') {
            btn.disabled = true;
            statusText.innerText = '신청 대기중입니다.';
            return;
        }

        if (trip.applicationStatus === 'APPROVED') {
            btn.disabled = true;
            statusText.innerText = '신청이 승인되었습니다.';
            showChatButton();
            return;
        }

        if (trip.applicationStatus === 'REJECTED') {
            statusText.innerText = '신청이 거절되었습니다. 다시 신청할 수 있습니다.';
        }
    }

    /* =========================
       신청하기
    ========================= */
    document.getElementById('applyBtn').addEventListener('click', () => {
        if (!currentTrip) return;

        const token = localStorage.getItem("accessToken");
        fetch(`/api/applications/trips/${tripId}?userId=${userId}`, {
            method: 'POST',
            headers: {
    "Authorization": "Bearer " + token
  }
        })
        .then(res => {
            if (!res.ok) {
                return res.text().then(msg => { throw new Error(msg); });
            }
            return res.json();
        })
        .then(() => {
            alert('신청이 완료되었습니다.');
            location.reload();
        })
        .catch(err => alert(err.message));
    });

function showChatButton() {
  const btn = document.getElementById("chatBtn");
  btn.style.display = "inline-block";
  btn.onclick = () => {
    location.href = `/chat/room/${tripId}`;
  };
}


/* 초기 로딩 */
    loadTripDetail();
</script>

</body>
</html>
