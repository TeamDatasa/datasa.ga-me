<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Trip Filter Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin-bottom: 15px; }
        button {
            padding: 6px 12px;
            margin-right: 6px;
            cursor: pointer;
        }
        button.active {
            background-color: #333;
            color: #fff;
        }
        .trip {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<nav class="quick-menu">
    <a href="/">홈</a>

    <a th:if="${isLogin}" href="/course/create">코스 등록</a>
    <a th:if="${isLogin}" href="/mypage">마이페이지</a>

    <a th:unless="${isLogin}" href="/login">로그인</a>
    <a th:unless="${isLogin}" href="/signup">로그인</a>
</nav>
<h2>여행 목록</h2>

<!-- 언어 필터 -->
<div class="section">
    <strong>언어:</strong>
    <label><input type="checkbox" value="ko" class="lang"> KO</label>
    <label><input type="checkbox" value="en" class="lang"> EN</label>
    <label><input type="checkbox" value="ja" class="lang"> JA</label>
</div>

<!-- 정렬 버튼 -->
<div class="section">
    <strong>정렬:</strong>
    <button id="latestBtn" class="active" onclick="setOrder('latest')">최신순</button>
    <button id="popularBtn" onclick="setOrder('popular')">인기순</button>
</div>

<button onclick="applyFilter()">적용</button>

<hr>

<div id="result"></div>

<script>
    let currentOrder = 'latest';

    /* 초기 로드 */
    window.onload = function () {
        loadTrips();
    };

    function setOrder(order) {
        currentOrder = order;

        document.getElementById('latestBtn').classList.remove('active');
        document.getElementById('popularBtn').classList.remove('active');

        if (order === 'latest') {
            document.getElementById('latestBtn').classList.add('active');
        } else {
            document.getElementById('popularBtn').classList.add('active');
        }

        applyFilter();
    }

    /* 전체 목록 */
    function loadTrips() {
        fetch(`/api/trips?order=${currentOrder}`)
            .then(res => res.json())
            .then(data => renderTrips(data.content))
            .catch(console.error);
    }

    /* 필터 적용 */
    function applyFilter() {
        const checked = document.querySelectorAll('.lang:checked');

        // 언어 선택 안 하면 전체 목록
        if (checked.length === 0) {
            loadTrips();
            return;
        }

        // 여러 언어 선택 → 결과 합치기
        let promises = [];
        checked.forEach(cb => {
            const lang = cb.value;
            promises.push(
                fetch(`/api/trips/search?language=${lang}&order=${currentOrder}`)
                    .then(res => res.json())
                    .then(data => data.content)
            );
        });

        Promise.all(promises)
            .then(results => {
                // 중복 제거 (tripId 기준)
                const map = new Map();
                results.flat().forEach(trip => {
                    map.set(trip.tripId, trip);
                });
                renderTrips([...map.values()]);
            });
    }

    /* 화면 렌더링 */
    function renderTrips(trips) {
        const result = document.getElementById('result');
        result.innerHTML = '';

        if (!trips || trips.length === 0) {
            result.innerHTML = '<p>표시할 여행이 없습니다.</p>';
            return;
        }

        trips.forEach(trip => {
            const div = document.createElement('div');
            div.className = 'trip';
            div.innerHTML = `
                <h3>${trip.title}</h3>
                <p>시작일: ${trip.startAt}</p>
                <p>비용: ${trip.estimatedCost}</p>
                <p>상태: ${trip.status}</p>
            `;
            result.appendChild(div);
        });
    }
</script>

</body>
</html>
