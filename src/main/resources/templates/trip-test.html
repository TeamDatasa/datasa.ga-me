<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Trip Filter Test</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
        }
        h2 {
          margin-bottom: 10px;
        }
        .section {
          margin-bottom: 14px;
          display: flex;
          gap: 14px;
          flex-wrap: wrap;
          align-items: center;
        }
        .box {
          padding: 10px;
          border: 1px solid #e5e5e5;
          border-radius: 8px;
        }
        button {
          padding: 6px 12px;
          cursor: pointer;
        }
        button.active {
          background-color: #333;
          color: #fff;
        }
        select {
          padding: 6px;
        }
        .trip {
          border: 1px solid #ddd;
          padding: 12px;
          margin-bottom: 10px;
          border-radius: 6px;
        }
        .muted {
          color: #777;
          font-size: 13px;
        }
    </style>
</head>
<body>

<h2>여행 목록 / 필터 테스트</h2>

<!-- 필터 영역 -->
<div class="section">

    <!-- 언어 (복수 선택) -->
    <div class="box">
        <strong>언어</strong>
        <span class="muted">(복수 선택)</span><br/>
        <label><input type="checkbox" class="lang" value="ko"> KO</label>
        <label><input type="checkbox" class="lang" value="en"> EN</label>
        <label><input type="checkbox" class="lang" value="ja"> JA</label>
    </div>

    <!-- 지역 -->
    <div class="box">
        <strong>지역</strong><br/>
        <select id="region">
            <option value="">전체</option>
            <option value="BUSAN">부산</option>
            <option value="SEOUL">서울</option>
            <option value="JEJU">제주</option>
            <option value="DAEGU">대구</option>
            <option value="GYEONGJU">경주</option>
            <option value="GANGNEUNG">강릉</option>
            <option value="JEONJU">전주</option>
        </select>
    </div>

    <!-- 테마 -->
    <div class="box">
        <strong>테마</strong><br/>
        <select id="theme">
            <option value="">전체</option>
            <option value="FOOD">FOOD</option>
            <option value="WALK">WALK</option>
            <option value="NIGHT">NIGHT</option>
            <option value="PHOTO">PHOTO</option>
            <option value="HISTORY">HISTORY</option>
            <option value="SHOPPING">SHOPPING</option>
        </select>
    </div>

    <!-- 정렬 -->
    <div class="box">
        <strong>정렬</strong><br/>
        <button id="latestBtn" class="active" onclick="setOrder('latest')">최신순</button>
        <button id="popularBtn" onclick="setOrder('popular')">인기순</button>
    </div>
</div>

<!-- 액션 버튼 -->
<div class="section">
    <button onclick="applyFilter()">적용</button>
    <button onclick="resetFilter()">초기화</button>
</div>

<hr/>

<!-- 결과 -->
<div id="result"></div>

<script>
    let currentOrder = 'latest';

    window.onload = function () {
      loadTrips();
    };

    /* 정렬 변경 */
    function setOrder(order) {
      currentOrder = order;
      document.getElementById('latestBtn').classList.toggle('active', order === 'latest');
      document.getElementById('popularBtn').classList.toggle('active', order === 'popular');
      applyFilter();
    }

    /* 전체 목록 */
    function loadTrips() {
      fetch(`/api/trips?order=${currentOrder}`)
        .then(res => res.json())
        .then(data => renderTrips(data.content))
        .catch(showError);
    }

    /* 필터 적용 */
    function applyFilter() {
      const region = document.getElementById('region').value;
      const theme = document.getElementById('theme').value;
      const checkedLangs = Array.from(
        document.querySelectorAll('.lang:checked')
      ).map(cb => cb.value);

      const hasAnyFilter =
        region !== '' || theme !== '' || checkedLangs.length > 0;

      if (!hasAnyFilter) {
        loadTrips();
        return;
      }

      function buildSearchUrl(params) {
        const qs = new URLSearchParams();
        Object.entries(params).forEach(([key, value]) => {
          if (value !== null && value !== undefined && value !== '') {
            qs.append(key, value);
          }
        });
        return `/api/trips/search?${qs.toString()}`;
      }

      const promises = [];

      if (checkedLangs.length === 0) {
        const url = buildSearchUrl({
          order: currentOrder,
          region,
          theme
        });
        promises.push(fetch(url).then(r => r.json()).then(d => d.content));
      } else {
        checkedLangs.forEach(lang => {
          const url = buildSearchUrl({
            order: currentOrder,
            language: lang,
            region,
            theme
          });
          promises.push(fetch(url).then(r => r.json()).then(d => d.content));
        });
      }

      Promise.all(promises)
        .then(results => {
          const map = new Map();
          results.flat().forEach(trip => {
            map.set(trip.tripId, trip);
          });
          renderTrips([...map.values()]);
        })
        .catch(showError);
    }

    /* 초기화 */
    function resetFilter() {
      document.querySelectorAll('.lang').forEach(cb => cb.checked = false);
      document.getElementById('region').value = '';
      document.getElementById('theme').value = '';
      setOrder('latest');
    }

    /* 렌더링 */
    function renderTrips(trips) {
      const result = document.getElementById('result');
      result.innerHTML = '';

      if (!trips || trips.length === 0) {
        result.innerHTML = '<p class="muted">표시할 여행이 없습니다.</p>';
        return;
      }

      trips.forEach(trip => {
        const div = document.createElement('div');
        div.className = 'trip';
        div.innerHTML = `
          <h3>${trip.title}</h3>
          <p>지역: ${trip.region ?? '-'}</p>
          <p>테마: ${trip.theme ?? '-'}</p>
          <p>시작일: ${trip.startAt}</p>
          <p>비용: ${trip.estimatedCost}</p>
          <p>상태: ${trip.status}</p>
        `;
        result.appendChild(div);
      });
    }

    function showError(err) {
      console.error(err);
      document.getElementById('result').innerHTML =
        '<p style="color:red">요청 중 오류가 발생했습니다. 콘솔/서버 로그를 확인하세요.</p>';
    }
</script>

</body>
</html>
