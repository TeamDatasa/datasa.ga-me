<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チャットルーム</title>
    <link rel="stylesheet" th:href="@{/css/chat-room.css}">
</head>
<body>


<div class="chat-container">
    <div id="chatMessages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="メッセージを入力" />
        <button onclick="sendMessage()">送信</button>
    </div>
</div>
<div class="chat-footer">


</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>
    window.ROOM_ID = [[${roomId}]];
    window.USER_ID = [[${userId}]];
    window.TRIP_ID = /*[[${tripId}]]*/ 0;
    window.CHAT_READ_ONLY = [[${readOnly}]];

      const __params = new URLSearchParams(location.search);
    const __isEmbed = __params.get("embed") === "1";
    if (__isEmbed) document.body.classList.add("embed");

function goToChatRooms() {

          if (__isEmbed && window.parent) {
         window.parent.postMessage({ type: "CHAT_MODAL_BACK" }, "*");
         return;
       }
   window.location.href = "/chat/rooms";
}
</script>

<script src="/js/chat-room.js"></script>


</body>
</html>
