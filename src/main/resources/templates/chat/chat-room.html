<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title><style>
/* =========================
   기본 설정
========================= */
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f5f5;
}

/* =========================
   채팅 컨테이너
========================= */
.chat-container {
  max-width: 600px;
  margin: 0 auto;
  background-color: #bcd3e6;
  padding: 16px;
  height: 80vh;
  display: flex;
  flex-direction: column;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* 메시지 스크롤 영역 */
#chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* =========================
   메시지 공통
========================= */
.chat-message {
  display: flex;
  margin-bottom: 14px;
}

/* 연속 메시지일 경우 위 여백 줄이기 */
.chat-message.continued {
  margin-top: 2px;
}

/* =========================
   상대 메시지 (왼쪽)
========================= */
.chat-message.other {
  align-items: flex-start;
}

/* 프로필 */
.profile img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  margin-right: 10px;
}

/* =========================
   내 메시지 (오른쪽)
========================= */
.chat-message.me {
  justify-content: flex-end;
}

/* =========================
   메시지 영역
========================= */
.message-area {
  display: flex;
  flex-direction: column;
}

/* 보낸 사람 이름 */
.sender {
  font-size: 12px;
  color: #333;
  margin-bottom: 2px;
}

/* =========================
   말풍선 + 시간
========================= */
.bubble-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
}

/* 내 메시지일 때 */
.bubble-row.me {
  justify-content: flex-end;
}

/* 말풍선 공통 */
.bubble {
  display: inline-block;
  max-width: 360px;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.4;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}

/* 상대 말풍선 */
.bubble.white {
  background: #ffffff;
  border: 1px solid #ddd;
}

/* 내 말풍선 */
.bubble.yellow {
  background: #ffe812;
}

/* =========================
   시간
========================= */
.time {
  font-size: 12px;
  color: #555;
  white-space: nowrap;
}

/* =========================
   번역 버튼 영역
========================= */
.translate-area {
  margin-top: 4px;
}

.translate-area.right {
  text-align: right;
}

.translate-btn {
  background: none;
  border: none;
  font-size: 12px;
  color: #555;
  cursor: pointer;
  padding: 0;
}

.translate-btn:hover {
  text-decoration: underline;
}

.translate-select {
  margin-top: 4px;
  font-size: 12px;
  padding: 2px;
}

/* =========================
   입력 영역
========================= */
.input-area {
  display: flex;
  padding: 8px;
  border-top: 1px solid #ddd;
  background: #fff;
}

.input-area input {
  flex: 1;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-right: 6px;
}

.input-area button {
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  background: #ffe812;
  cursor: pointer;
}

/* 프로필 영역은 항상 공간 차지 */
.chat-message.other .profile {
  width: 42px;
  height: 42px;
  margin-right: 10px;
  flex-shrink: 0;
}

/* 연속 메시지일 경우: 프로필 숨김 (공간은 유지) */
.chat-message.other.continued .profile {
  visibility: hidden;

  
}

.chat-message.other.continued .sender {
  display: none;
}

</style>

</head>
<body>

<h3>채팅방</h3>
<div class="chat-container">
    <div id="chatMessages"></div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="메시지 입력" />
        <button onclick="sendMessage()">전송</button>
    </div>
</div>
<button onclick="leaveRoom()">나가기</button>
<button onclick="goToChatRooms()">채팅방목록으로</button>



<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>
    window.ROOM_ID = [[${roomId}]];
    const params = new URLSearchParams(window.location.search);
    window.USER_ID = Number(params.get("userId") ?? 1);

function goToChatRooms() {
    window.location.href = "/chat/rooms";
}
</script>

<script src="/js/chat-room.js"></script>


</body>
</html>
