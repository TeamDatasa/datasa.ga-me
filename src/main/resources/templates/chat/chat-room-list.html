<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>チャット</title>
</head>
<style>
    body {
  margin: 0;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}



/* チャット방 카드 */
.chat-room-card {
  display: flex;
  padding: 14px 16px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  transition: background 0.15s;
}

.chat-room-card:hover {
  background: #fafafa;
}

/* 프로필 */
.profile {
  margin-right: 12px;
}

.profile img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}

/* チャット 정보 */
.chat-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* 상단 */
.chat-info .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 16px;
  font-weight: 600;
  color: #111;
}

.time {
  font-size: 12px;
  color: #999;
}

/* 하단 */
.chat-info .bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
}

.last-message {
  font-size: 14px;
  color: #666;
  max-width: 80%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 안 읽은 메市지 수 */
.unread-count {
  background: #ff3b30;
  color: white;
  font-size: 12px;
  font-weight: 600;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

    .chat-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: none;                /* 기본 숨김 */
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.chat-modal {
  width: min(920px, 92vw);
  height: min(760px, 92vh);
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 18px 60px rgba(0,0,0,.25);
  display: flex;
  flex-direction: column;
}

.chat-modal-header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid #eee;
}

.chat-modal-title {
  font-weight: 800;
}

.chat-modal-close {
  border: 0;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
}

.chat-modal-body {
  flex: 1;
  position: relative;
}

#chatRoomFrame {
  width: 100%;
  height: 100%;
  border: 0;
}


.yw-container {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 24px;
}



.mypage-container {
  max-width: 820px;
  margin: 0 auto;
  padding: 0 24px 24px;
}

.panel {
  background: #fff;
  border-radius: 16px;
  border: 1px solid #eee;
  overflow: hidden;
}


.chat-list-container {
  width: 100%;
  margin: 0;
  background: transparent;
}



</style>
<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="/css/users/mypage.css" />
    <link rel="stylesheet" href="/css/users/mypage-user.css" />
</head>

<body>
<header class="yw-header">
    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <div class="yw-auth">

            <a class="yw-icon-btn" href="/" aria-label="メイン画面">
                <span class="yw-icon" aria-hidden="true">✕</span>
            </a>
        </div>
    </div>
</header>
<div class="mypage-container">
    <div class="panel">
        <div class="chat-list-container" id="chatRoomList"></div>
    </div>
</div>
<div id="chatModalOverlay" class="chat-modal-overlay">
    <div class="chat-modal" role="dialog" aria-modal="true">
        <div class="chat-modal-header">
            <div class="chat-modal-title" id="chatModalTitle">チャット</div>
            <button class="chat-modal-close" id="chatModalCloseBtn" aria-label="閉じる">×</button>
        </div>
        <div class="chat-modal-body">
            <iframe id="chatRoomFrame" src="about:blank"></iframe>
        </div>
    </div>
</div>
<script>
    // Thymeleaf에서 userId만 전달
    const userId = [[${userId}]];

    document.addEventListener("DOMContentLoaded", () => {
        loadChatRooms();

            // 戻る가기/재진입 市에道 다市 로드
    window.addEventListener("focus", () => {
        loadChatRooms();
    });

            window.addEventListener("message", (event) => {
          if (!event || !event.data) return;
          if (event.data.type === "CHAT_MODAL_BACK") {
            closeChatModal();
            return;
          }
            if (event.data.type === "CHAT_LEFT") {
    closeChatModal();
    loadChatRooms();
  }
        });

    });

    function loadChatRooms() {
        fetch(`/api/chat/rooms?userId=${userId}`)
            .then(res => {
                if (!res.ok) {
                    throw new Error("チャットルーム一覧の取得に失敗しました");
                }
                return res.json();
            })
            .then(rooms => {
                renderChatRooms(rooms);
            })
            .catch(err => {
                console.error(err);
                alert("チャットルーム一覧を読み込めませんでした。");
            });
    }

const THEME_PROFILE_IMG = {
  FOOD: "/images/theme/food.png",
  CITY: "/images/theme/city.png",
  NATURE: "/images/theme/nature.png",
  HEALING: "/images/theme/healing.png",
  SHOPPING: "/images/theme/shopping.png",
  CULTURE: "/images/theme/history.png",
  ACTIVITY: "/images/theme/activity.png",
  NIGHT: "/images/theme/night.png",
  PHOTO: "/images/theme/photo.png",
  TRADITION: "/images/theme/tradition.png",
  DEFAULT: "/images/theme/default.png",

};


function normalizeTheme(theme) {
  const t = String(theme ?? "").trim();
  if (!t) return "DEFAULT";
  const upper = t.toUpperCase();

  const koMap = {
    "グルメ": "FOOD",
    "自然": "NATURE",
    "都市": "CITY",
    "ショッピング": "SHOPPING",
    "写真": "PHOTO",
    "アクティビティ": "ACTIVITY",
    "夜景": "NIGHT",
    "癒やし": "HEALING",
    "文化": "CULTURE",
    "伝統": "TRADITION",
    "歴史": "HISTORY",
    "その他": "DEFAULT",
  };

  return koMap[t] || upper;
}

function themeProfileSrc(theme) {
  const key = normalizeTheme(theme);
  return THEME_PROFILE_IMG[key] || THEME_PROFILE_IMG.DEFAULT;
}



    function renderChatRooms(rooms) {
        const list = document.getElementById("chatRoomList");
        list.innerHTML = "";

        if (rooms.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    参加中のチャットルームがありません。
                </div>
            `;
            return;
        }
          rooms.sort((a, b) => {
    const at = a.lastMessageAt ? new Date(a.lastMessageAt).getTime() : 0;
    const bt = b.lastMessageAt ? new Date(b.lastMessageAt).getTime() : 0;
    return bt - at;
  });


        rooms.forEach(room => {
            const card = document.createElement("div");
            card.className = "chat-room-card";

    card.addEventListener("click", () => {
         openChatModal(room.tripId, room.title);
    });

            const timeText = room.lastMessageAt
                ? formatTime(room.lastMessageAt)
                : "";

            const imgSrc = themeProfileSrc(room.theme);
            card.innerHTML = `
            <div class="profile"><img src="${imgSrc}" alt="profile"></div>


                <div class="chat-info">
                    <div class="top">
                        <span class="title">${room.title}</span>
                        <span class="time">${timeText}</span>
                    </div>

                    <div class="bottom">
                        <span class="last-message">
                            ${room.lastMessage ?? "会話がありません"}
                        </span>

                        ${
                            room.unreadCount > 0
                                ? `<span class="unread-count">${room.unreadCount}</span>`
                                : ""
                        }
                    </div>
                </div>
            `;

            list.appendChild(card);
        });
    }

    function formatTime(dateTime) {
        const date = new Date(dateTime);
        let hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, "0");

        const isPM = hours >= 12;
        const period = isPM ? "午後" : "午前";

        hours = hours % 12;
        if (hours === 0) hours = 12;

        return `${period} ${hours}:${minutes}`;
    }


      //  Enter 전송 / Shift+Enter 줄바꿈 (네가 추가한 부분 유지)
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("messageInput");
    if (!input) return;

    input.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter") {
        if (e.shiftKey) return;
        e.preventDefault();
        sendMessage();
      }
    });
  });
     const overlay = document.getElementById("chatModalOverlay");
    const frame = document.getElementById("chatRoomFrame");
    const closeBtn = document.getElementById("chatModalCloseBtn");
    const titleEl = document.getElementById("chatModalTitle");

    function openChatModal(tripId, title) {
      titleEl.textContent = title || "チャット";
      overlay.style.display = "flex";
      // embed=1 추가 (チャット 화면을 모달에 맞게 표市하기 위해)
      frame.src = `/chat/room/${tripId}?userId=${userId}&embed=1`;
      document.body.style.overflow = "hidden";
    }

    function closeChatModal() {
      overlay.style.display = "none";
      frame.src = "about:blank";
      document.body.style.overflow = "";
    }

    closeBtn.addEventListener("click", closeChatModal);

    // 모달 밖 클릭 市 閉じる
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeChatModal();
    });

    // ESC 閉じる
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && overlay.style.display === "flex") {
        closeChatModal();
      }
    });


</script>

</body>
</html>
