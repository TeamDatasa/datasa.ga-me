<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅</title>
</head>
<style>
    body {
  margin: 0;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}

.chat-list-container {
  max-width: 600px;
  margin: 0 auto;
  background: white;
}

/* 채팅방 카드 */
.chat-room-card {
  display: flex;
  padding: 14px 16px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  transition: background 0.15s;
}

.chat-room-card:hover {
  background: #fafafa;
}

/* 프로필 */
.profile {
  margin-right: 12px;
}

.profile img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
}

/* 채팅 정보 */
.chat-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* 상단 */
.chat-info .top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.title {
  font-size: 16px;
  font-weight: 600;
  color: #111;
}

.time {
  font-size: 12px;
  color: #999;
}

/* 하단 */
.chat-info .bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
}

.last-message {
  font-size: 14px;
  color: #666;
  max-width: 80%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* 안 읽은 메시지 수 */
.unread-count {
  background: #ff3b30;
  color: white;
  font-size: 12px;
  font-weight: 600;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

</style>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
</head>

<body>

<div class="chat-list-container" id="chatRoomList">

</div>

<script>
    // Thymeleaf에서 userId만 전달
    const userId = [[${userId}]];

    document.addEventListener("DOMContentLoaded", () => {
        loadChatRooms();

            // 뒤로가기/재진입 시에도 다시 로드
    window.addEventListener("focus", () => {
        loadChatRooms();
    });

    });

    function loadChatRooms() {
        fetch(`/api/chat/rooms?userId=${userId}`)
            .then(res => {
                if (!res.ok) {
                    throw new Error("채팅방 목록 조회 실패");
                }
                return res.json();
            })
            .then(rooms => {
                renderChatRooms(rooms);
            })
            .catch(err => {
                console.error(err);
                alert("채팅방 목록을 불러오지 못했습니다.");
            });
    }

    function renderChatRooms(rooms) {
        const list = document.getElementById("chatRoomList");
        list.innerHTML = "";

        if (rooms.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    참여 중인 채팅방이 없습니다.
                </div>
            `;
            return;
        }

        rooms.forEach(room => {
            const card = document.createElement("div");
            card.className = "chat-room-card";

    card.addEventListener("click", () => {
        window.location.href = `/chat/room/${room.tripId}`;
    });

            const timeText = room.lastMessageAt
                ? formatTime(room.lastMessageAt)
                : "";

            card.innerHTML = `
                <div class="profile">
                    <img src="/images/profile.png" alt="profile">
                </div>

                <div class="chat-info">
                    <div class="top">
                        <span class="title">${room.title}</span>
                        <span class="time">${timeText}</span>
                    </div>

                    <div class="bottom">
                        <span class="last-message">
                            ${room.lastMessage ?? "대화가 없습니다"}
                        </span>

                        ${
                            room.unreadCount > 0
                                ? `<span class="unread-count">${room.unreadCount}</span>`
                                : ""
                        }
                    </div>
                </div>
            `;

            list.appendChild(card);
        });
    }

    function formatTime(dateTime) {
        const date = new Date(dateTime);
        let hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, "0");

        const isPM = hours >= 12;
        const period = isPM ? "오후" : "오전";

        hours = hours % 12;
        if (hours === 0) hours = 12;

        return `${period} ${hours}:${minutes}`;
    }

</script>

</body>
</html>
