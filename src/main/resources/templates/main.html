        </a>

        <nav class="yw-nav">

        <div class="yw-auth">
            <!-- 비로그인 -->
            <div id="guestMenu">

                <a class="yw-btn yw-btn--primary" th:href="@{/signup}">회원가입</a>
            </div>

            <!-- 로그인 -->
            <div id="userMenu" style="display:none;">
                <a class="yw-nav__link chat-link" href="/chat/rooms">

                <div th:replace="~{fragments/topbar :: notifTopbar}"></div>
                <a class="yw-btn yw-btn--ghost" th:href="@{/mypage}">마이페이지</a>
                <button class="yw-btn yw-btn--primary" type="button" id="logoutBtn">로그아웃</button>
            </div>

        </div>
    </div>
</header>

                <!-- RECOMMEND LIST -->
    <aside class="yw-section">
        <div class="yw-container">
            <div class="yw-section__head yw-section__head--row">
                <h2 class="yw-section__title">이번주 추천 코스</h2>
                <a class="yw-section__link" href="/courses">더보기</a>
            </div>
            <div class="yw-cards">
                <article class="yw-card" th:each="course : ${recommendCourses}"th:onclick="|location.href='api/trip/detail/' + ${course.tripId}|">
                    <div class="yw-card__thumb"></div>
                    <div class="yw-card__body">
                        <div class="yw-card__title" th:text="${course.title}">코스 제목</div>
                        <div class="yw-card__meta">
                            <span th:text="${course.region}">지역</span>
                            <span class="yw-dot">•</span>
                            <span th:text="${course.source}">AI</span>
                        </div>
                    </div>
                </article>

                <article class="yw-card" th:if="${recommendCourses == null || #lists.isEmpty(recommendCourses)}">
                    <div class="yw-card__thumb"></div>
                    <div class="yw-card__body">
                        <div class="yw-card__title">추천 코스 추가 예정</div>
                        <div class="yw-card__meta">데이터 연결되면 자동으로 뜸</div>
                    </div>
                </article>
            </div>
        </div>

 <!-- 🔍 필터 + 전체 리스트 -->
 <section class="yw-section">
    <div class="yw-container">

      <!-- 필터 영역 -->
      <div class="yw-filter">

        <!-- 언어 -->
        <div class="yw-filter__box">
          <strong>언어</strong>
          <span class="yw-muted">(복수 선택)</span>
          <label><input type="checkbox" class="lang" value="ko"> KO</label>
          <label><input type="checkbox" class="lang" value="en"> EN</label>
          <label><input type="checkbox" class="lang" value="ja"> JA</label>
        </div>

        <!-- 지역 -->
        <div class="yw-filter__box">
          <strong>지역</strong>
          <select id="region">
            <option value="">전체</option>
            <option value="BUSAN">부산</option>
            <option value="SEOUL">서울</option>
            <option value="JEJU">제주</option>
            <option value="DAEGU">대구</option>
            <option value="GYEONGJU">경주</option>
            <option value="GANGNEUNG">강릉</option>
            <option value="JEONJU">전주</option>
          </select>
        </div>

        <!-- 테마 -->
        <div class="yw-filter__box">
          <strong>테마</strong>
          <select id="theme">
            <option value="">전체</option>
            <option value="FOOD">FOOD</option>
            <option value="WALK">WALK</option>
            <option value="NIGHT">NIGHT</option>
            <option value="PHOTO">PHOTO</option>
            <option value="HISTORY">HISTORY</option>
            <option value="SHOPPING">SHOPPING</option>
          </select>
        </div>

        <!-- 정렬 -->
        <div class="yw-filter__box">
          <strong>정렬</strong>
          <button id="latestBtn" class="active" onclick="setOrder('latest')">
            최신순
          </button>
          <button id="popularBtn" onclick="setOrder('popular')">
            인기순
          </button>
        </div>

      </div>

      <!-- 전체 프로젝트 리스트 -->
      <div class="yw-cards" id="tripList">
        <!-- JS 렌더링 -->
      </div>

    </div>
  </section>

</main>

<footer class="yw-footer">
