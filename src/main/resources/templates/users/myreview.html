<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>マイレビュー</title>
    <link rel="stylesheet" href="/css/users/mypage.css" />
    <link rel="stylesheet" href="/css/users/mypage-user.css" />
</head>

<body>
<div class="details-wrap">
    <header class="yw-header">
        <div class="yw-container yw-header__inner">
            <a class="yw-logo" href="/">
                <span class="yw-logo__mark">●</span>
                <span class="yw-logo__text">ga-me</span>
            </a>

            <div class="yw-auth">
                <div class="auth-lang mypage-lang">
                    <select id="langSelect" class="translate-select">
                        <option value="ko">韓国語</option>
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <a class="yw-icon-btn" href="/mypage" aria-label="閉じる">
                    <span class="yw-icon" aria-hidden="true">✕</span>
                </a>
            </div>
        </div>
    </header>

    <section class="panel">
        <div class="panel-head">
            <div>
                <h3>マイレビュー</h3>
                <p class="hint">ツアー終了後に作成できます。ツアーごとにレビューは1件まで作成可能です。</p>
            </div>
            <a class="btn btn-ghost" th:href="@{/mypage/reviews}">リセット</a>
        </div>

        <!-- ✅ 기존 우측 mode 패널 제거: 목록만 사용 (모달로 처리) -->
        <div class="grid" style="grid-template-columns: 1fr; margin-top:14px;">
            <div class="panel" style="box-shadow:none; border:1px solid var(--border);">
                <h3 style="margin:0 0 6px 0;">参加したツアー</h3>
                <p class="hint">承認済みの参加ツアー一覧です。</p>

                <div class="empty" th:if="${items == null or #lists.isEmpty(items)}" style="height:90px;">
                    承認されたツアーはまだありません。
                </div>

                <ul class="list" th:if="${items != null and !#lists.isEmpty(items)}">
                    <li class="list-item" th:each="t : ${items}">
                        <div class="title" th:text="${t.title()}">ツアータイトル</div>
                        <div class="meta">
                            <span th:text="${t.region()}">地域</span>
                            · <span th:text="${#temporals.format(t.startAt(), 'yyyy-MM-dd HH:mm')}">開始日</span>
                            ~ <span th:text="${#temporals.format(t.endAt(), 'yyyy-MM-dd HH:mm')}">終了日</span>
                        </div>

                        <div class="actions">
                            <!-- 作成 -->
                            <button type="button"
                                    class="btn"
                                    th:if="${t.canWrite()}"
                                    th:attr="data-trip-id=${t.tripId()}"
                                    onclick="openReviewModal('new', this)">
                                作成
                            </button>

                            <!-- 修正 -->
                            <button type="button"
                                    class="btn"
                                    th:if="${t.hasReview()}"
                                    th:attr="data-trip-id=${t.tripId()},
                                             data-review-id=${t.reviewId()},
                                             data-rating=${t.rating()},
                                             data-content=${t.content()}"
                                    onclick="openReviewModal('edit', this)">
                                修正
                            </button>

                            <!-- 削除 -->
                            <button type="button"
                                    class="btn btn-danger"
                                    th:if="${t.hasReview()}"
                                    th:attr="data-review-id=${t.reviewId()}"
                                    onclick="openReviewModal('delete', this)">
                                削除
                            </button>

                            <span class="hint" th:if="${!t.ended()}" style="margin-left:6px;">
                終了後に作成可能
              </span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </section>
</div>

<!-- =========================
     Modal
========================= -->
<div id="reviewModal" class="yw-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="yw-modal__card">
        <div class="yw-modal__head">
            <h3 id="modalTitle" class="yw-modal__title">レビュー</h3>
            <button type="button" class="yw-icon-btn" aria-label="閉じる" onclick="closeReviewModal()">
                <span class="yw-icon" aria-hidden="true">✕</span>
            </button>
        </div>

        <form id="reviewForm" method="post" class="yw-modal__body">
            <input type="hidden" name="tripId" id="modalTripId">
            <input type="hidden" name="reviewId" id="modalReviewId">

            <!-- 作成/修正 필드 -->
            <div id="modalFields">
                <div class="row">
                    <label id="labelRating">評価</label>
                    <select name="rating" id="modalRating">
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>

                <div class="row">
                    <label id="labelContent">内容</label>
                    <textarea name="content" id="modalContent" placeholder="ツアー体験を入力してください..."></textarea>
                </div>
            </div>

            <!-- 削除 안내 -->
            <div id="deleteBox" class="yw-modal__dangerBox" style="display:none;">
                <p id="deleteHint" class="hint" style="margin:0;">
                    本当に削除しますか？削除すると元に戻せません。
                </p>
            </div>

            <div class="yw-modal__actions">
                <button type="button" class="btn btn-ghost" onclick="closeReviewModal()">キャンセル</button>
                <button id="modalSubmitBtn" type="submit" class="btn">保存</button>
            </div>
        </form>
    </div>
</div>
<script src="/js/mypage-reviews-modal.js" defer></script>
</body>
</html>
