<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Page Details</title>
    <link rel="stylesheet" href="/css/users/mypage.css" />
    <link rel="stylesheet" href="/css/users/mypage-user.css" />
</head>

<body>
<div class="details-wrap">
    <header class="yw-header">
        <div class="yw-container yw-header__inner">
            <a class="yw-logo" href="/">
                <span class="yw-logo__mark">●</span>
                <span class="yw-logo__text">ga-me</span>
            </a>

            <div class="yw-auth">
                <div class="auth-lang mypage-lang">
                    <select id="langSelect" class="translate-select">
                        <option value="ko">한국어</option>
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <a class="yw-icon-btn" href="/mypage" aria-label="뒤로">
                    <span class="yw-icon" aria-hidden="true">✕</span>
                </a>
            </div>
        </div>
    </header>

    <section class="panel">
        <div class="grid">
            <a class="card card-link" th:href="@{/mypage/applications}">
                <div class="card-title" data-i18n="applicationStatus">신청 현황</div>
                <div class="card-meta" data-i18n="applicationStatusMeta">대기 / 승인 / 거절</div>

                <div class="status-badges">
          <span class="status pending">
            <span data-i18n="pending">대기</span>
            <b th:text="${counts != null ? counts.pending() : 0}">0</b>
          </span>
                    <span class="status approved">
            <span data-i18n="approved">승인</span>
            <b th:text="${counts != null ? counts.approved() : 0}">0</b>
          </span>
                    <span class="status rejected">
            <span data-i18n="rejected">거절</span>
            <b th:text="${counts != null ? counts.rejected() : 0}">0</b>
          </span>
                </div>
            </a>

        </div>

        <div class="panel" style="margin-top: 18px;">
            <div class="panel-head">
                <div>
                    <h3 data-i18n="myTours">내가 참여한 투어</h3>
                    <p class="hint" data-i18n="myToursHint">승인된 투어 목록입니다. 종료된 투어는 후기 작성이 가능합니다.</p>
                </div>
                <nav class="pagination"
                     th:if="${tourTotalPages != null and tourTotalPages > 1}">
                    <a class="page-btn"
                       th:classappend="${!tourHasPrev} ? 'is-disabled' : ''"
                       th:href="@{/mypage/details/user(tourPage=${tourPage - 1}, likePage=${likePage})}">
                        이전
                    </a>

                    <a class="page-btn"
                       th:each="p : ${tourPageNumbers}"
                       th:text="${p + 1}"
                       th:classappend="${p == tourPage} ? 'is-active' : ''"
                       th:href="@{/mypage/details/user(tourPage=${p}, likePage=${likePage})}">
                    </a>

                    <a class="page-btn"
                       th:classappend="${!tourHasNext} ? 'is-disabled' : ''"
                       th:href="@{/mypage/details/user(tourPage=${tourPage + 1}, likePage=${likePage})}">
                        다음
                    </a>
                </nav>
            </div>

            <ul class="list" th:if="${myTours != null and !#lists.isEmpty(myTours)}">
                <li class="list-item" th:each="t : ${myTours}">
                    <div class="title" th:text="${t.title()}">투어 제목</div>

                    <div class="meta">
                        <span th:text="${t.region()}">지역</span>
                        · <span th:text="${t.startAt()}">시작</span> ~ <span th:text="${t.endAt()}">종료</span>
                    </div>

                    <div class="actions">
                        <!-- 작성 -->
                        <button type="button"
                                class="btn"
                                th:if="${t.canReview()}"
                                th:attr="data-trip-id=${t.tripId()}"
                                onclick="openReviewModal('new', this)">
                            후기 작성
                        </button>

                        <!-- 수정 -->
                        <button type="button"
                                class="btn"
                                th:if="${t.reviewId() != null}"
                                th:attr="data-trip-id=${t.tripId()},
                                         data-review-id=${t.reviewId()}"
                                onclick="openReviewModal('edit', this)">
                            후기 수정
                        </button>

                        <!-- 삭제 -->
                        <button type="button"
                                class="btn btn-danger"
                                th:if="${t.reviewId() != null}"
                                th:attr="data-review-id=${t.reviewId()}"
                                onclick="openReviewModal('delete', this)">
                            후기 삭제
                        </button>
                    </div>
                </li>
            </ul>

            <div class="empty" th:if="${myTours == null or #lists.isEmpty(myTours)}" data-i18n="emptyTours">
                아직 승인된 투어가 없습니다.
            </div>
        </div>

        <div class="panel">
            <div class="panel-head">
                <div>
                    <h3 data-i18n="myLikes">내가 좋아요한 투어</h3>
                    <p class="hint" data-i18n="myLikesHint">최근 좋아요한 투어 목록입니다.</p>
                </div>
                <nav class="pagination"
                     th:if="${likeTotalPages != null and likeTotalPages > 1}">

                    <a class="page-btn"
                       th:classappend="${!likeHasPrev} ? 'is-disabled' : ''"
                       th:href="@{/mypage/details/user(tourPage=${tourPage}, likePage=${likePage - 1})}">
                        이전
                    </a>

                    <a class="page-btn"
                       th:each="p : ${likePageNumbers}"
                       th:text="${p + 1}"
                       th:classappend="${p == likePage} ? 'is-active' : ''"
                       th:href="@{/mypage/details/user(tourPage=${tourPage}, likePage=${p})}">
                    </a>

                    <a class="page-btn"
                       th:classappend="${!likeHasNext} ? 'is-disabled' : ''"
                       th:href="@{/mypage/details/user(tourPage=${tourPage}, likePage=${likePage + 1})}">
                        다음
                    </a>
                </nav>
            </div>

            <ul class="list" th:if="${myLikes != null and !#lists.isEmpty(myLikes)}">
                <li th:each="t : ${myLikes}">
                    <a class="list-item card-link"
                       th:href="@{/trip/detail/{tripId}(tripId=${t.tripId()})}">
                        <div class="title" th:text="${t.title()}">투어</div>
                        <div class="meta">
                            <span th:text="${t.region()}">지역</span>
                            · <span th:text="${#temporals.format(t.startAt(), 'yyyy-MM-dd HH:mm')}">시작</span>
                            ~ <span th:text="${#temporals.format(t.endAt(), 'yyyy-MM-dd HH:mm')}">종료</span>
                        </div>
                    </a>
                </li>
            </ul>

            <div class="empty" th:if="${myLikes == null or #lists.isEmpty(myLikes)}" data-i18n="emptyLikes">
                좋아요한 투어가 없습니다.
            </div>
        </div>

    </section>
</div>

<!-- =========================
     Review Modal (추가)
========================= -->
<div id="reviewModal" class="yw-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="yw-modal__card">
        <div class="yw-modal__head">
            <h3 id="modalTitle" class="yw-modal__title">리뷰</h3>
            <button type="button" class="yw-icon-btn" aria-label="닫기" onclick="closeReviewModal()">
                <span class="yw-icon" aria-hidden="true">✕</span>
            </button>
        </div>

        <form id="reviewForm" class="yw-modal__body" onsubmit="return false;">
            <th:block th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </th:block>

            <input type="hidden" name="tripId" id="modalTripId">
            <input type="hidden" name="reviewId" id="modalReviewId">

            <div id="modalFields">
                <div class="row">
                    <label id="labelRating">평점</label>
                    <select name="rating" id="modalRating" required>
                        <option value="5">5</option><option value="4">4</option><option value="3">3</option>
                        <option value="2">2</option><option value="1">1</option>
                    </select>
                </div>

                <div class="row">
                    <label id="labelContent">내용</label>
                    <textarea name="content" id="modalContent" required placeholder="투어 경험을 작성해주세요..."></textarea>
                </div>
            </div>

            <div id="deleteBox" class="yw-modal__dangerBox" style="display:none;">
                <p id="deleteHint" class="hint" style="margin:0;">
                    정말 삭제할까요? 삭제하면 되돌릴 수 없어요.
                </p>
            </div>

            <div class="yw-modal__actions">
                <button type="button" class="btn btn-ghost" onclick="closeReviewModal()">취소</button>
                <button id="modalSubmitBtn" type="submit" class="btn">저장</button>
            </div>
        </form>
    </div>
</div>


<script src="/js/mypage-details-i18n-modal.js" defer></script>
</body>
</html>
