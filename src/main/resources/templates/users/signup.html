<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/users/auth.css">
</head>
<body>

<div class="auth-container">
    <h1>Sign Up</h1>
    <p>Create your account</p>

    <form id="signupForm" class="auth-form">
        <label>Email</label>
        <input type="email" id="email" required />

        <div class="email-verify-group">
            <button type="button" id="sendCodeBtn" class="auth-btn secondary-btn">
                Send Verification Code
            </button>

            <div class="email-code-row">
                <input type="text" id="verificationCode" maxlength="6" placeholder="6-digit code" />
                <button type="button" id="verifyCodeBtn" class="auth-btn secondary-btn">
                    Verify
                </button>
            </div>

            <p id="emailVerifyStatus" class="helper-text"></p>
        </div>


        <label>Password</label>
        <input type="password" id="password" required />

        <label>Confirm Password</label>
        <input type="password" id="passwordConfirm" required />

        <label>Name</label>
        <input type="text" id="name" name="name" required />

        <label>User Type</label>
        <div class="role-group">
            <label class="role-option">
                <input type="radio" name="role" value="USER" checked>
                Traveler
            </label>

            <label class="role-option">
                <input type="radio" name="role" value="HOST">
                Guide
            </label>
        </div>


        <button type="submit" class="auth-btn" id="signupBtn" disabled>Sign Up</button>
    </form>

    <div class="auth-footer">
        Already have an account?
        <a href="/auth/login">Sign In</a>
    </div>
</div>

<script src="/js/signup.js"></script>
</body>
</html>
