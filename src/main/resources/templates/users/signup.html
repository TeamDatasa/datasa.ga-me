<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/css/users/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <div class="auth-lang">
            <select id="langSelect" class="translate-select"></select>
        </div>
    </div>

    <h1 data-i18n="signup.title">会員登録</h1>
    <p data-i18n="signup.subtitle">アカウントを作成してください</p>

    <form id="signupForm" class="auth-form">
        <label data-i18n="signup.emailLabel">メールアドレス</label>
        <input type="email" id="email" required />

        <div class="email-verify-group">
            <button type="button" id="sendCodeBtn" class="auth-btn secondary-btn" data-i18n="signup.sendCode">
                認証コード送信
            </button>

            <div class="email-code-row">
                <input type="text" id="verificationCode" maxlength="6"
                       data-i18n-placeholder="signup.codePlaceholder"
                       placeholder="6-digit code" />
                <button type="button" id="verifyCodeBtn" class="auth-btn secondary-btn" data-i18n="signup.verifyCode">
                    認証する
                </button>
            </div>

            <p id="emailVerifyStatus" class="helper-text"></p>
        </div>

        <label data-i18n="signup.passwordLabel">パスワード</label>
        <input type="password" id="password" required />

        <label data-i18n="signup.passwordConfirmLabel">パスワード確認</label>
        <input type="password" id="passwordConfirm" required />

        <label data-i18n="signup.nicknameLabel">ニックネーム</label>
        <input type="text" id="name" name="name" required />

        <label data-i18n="signup.birthDateLabel">生年月日</label>
        <input type="date" id="birthDate" required />

        <label data-i18n="signup.genderLabel">性別</label>
        <div class="role-group">
            <label class="role-option">
                <input type="radio" name="gender" value="FEMALE" checked>
                <span data-i18n="signup.gender.female">女性</span>
            </label>
            <label class="role-option">
                <input type="radio" name="gender" value="MALE">
                <span data-i18n="signup.gender.male">男性</span>
            </label>
            <label class="role-option">
                <input type="radio" name="gender" value="OTHER">
                <span data-i18n="signup.gender.other">その他</span>
            </label>
        </div>

        <label data-i18n="signup.countryLabel">国</label>
        <select id="country" class="translate-select country-select" required></select>

        <label data-i18n="signup.regionLabel">地域</label>

        <select id="regionSelect" class="translate-select country-select" style="display:none;"></select>

        <input type="text" id="regionInput" required
               data-i18n-placeholder="signup.regionPlaceholder"
               placeholder="例：釜山、東京、ソウル"
               style="display:none;" />

        <div id="mailModal" class="modal hidden">
            <div class="modal-card">
                <h3 id="mailModalTitle" data-i18n="signup.modal.sentTitle">認証メールを送信しました。</h3>
                <p id="mailModalMsg" data-i18n="signup.modal.sentMsg">送信完了まで少し時間がかかる場合があります。</p>
                <button type="button" id="mailModalClose" class="auth-btn secondary-btn" data-i18n="common.confirm">確認</button>
            </div>
        </div>

        <button type="submit" class="auth-btn" id="signupBtn" disabled data-i18n="signup.submit">会員登録</button>
    </form>

    <div class="auth-footer">
        <span data-i18n="signup.haveAccount">すでにアカウントをお持ちですか？</span>
        <a href="/auth/login" data-i18n="signup.loginLink">ログイン</a>
    </div>
</div>

<script src="/js/signup.js"></script>
</body>
</html>
