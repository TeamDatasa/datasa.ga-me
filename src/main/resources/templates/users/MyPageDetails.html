<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Page Details</title>
    <link rel="stylesheet" href="/css/mypage.css" />
</head>
<body>
<div class="mypage-container">

    <header class="mypage-header">
        <div class="brand">ga-me</div>
        <div class="header-actions">
            <a class="btn btn-ghost" href="/mypage">Back</a>
        </div>
    </header>

    <section class="panel">
        <h3>Details</h3>
        <p class="hint">This page will show different content depending on your role.</p>

        <div th:with="r=${role != null ? #strings.toUpperCase(#strings.trim(role.toString())) : ''}">

            <div th:if="${r == 'USER'}"
                 th:replace="users/MyPageDetailsUser :: content"></div>

            <div th:if="${r == 'HOST'}"
                 th:replace="users/MyPageDetailsHost :: content"></div>

            <div th:if="${r != 'USER' and r != 'HOST'}" class="hint">
                Your role information is not available.
            </div>

            <div class="hint">Current role: <span th:text="${r}"></span></div>
        </div>

    </section>

</div>

<script src="/js/mypage-details.js"></script>
</body>
</html>
