<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Page Details</title>
    <link rel="stylesheet" href="/css/users/mypage.css" />
    <link rel="stylesheet" href="/css/users/mypage-host.css" />
</head>

<body>
<div class="details-wrap">
    <header class="yw-header">
        <div class="yw-container yw-header__inner">
            <a class="yw-logo" href="/">
                <span class="yw-logo__mark">●</span>
                <span class="yw-logo__text">ga-me</span>
            </a>

            <div class="yw-auth">
                <div class="auth-lang mypage-lang">
                    <select id="langSelect" class="translate-select">
                        <option value="ko">韓国語</option>
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                    </select>
                </div>

                <a class="yw-icon-btn" href="/mypage" aria-label="戻る">
                    <span class="yw-icon" aria-hidden="true">✕</span>
                </a>
            </div>
        </div>
    </header>

    <section class="panel">
        <div class="grid grid--2">
            <a class="card" href="/host/trips/new">
                <div class="card-title" data-i18n="tourCreate">ツアー登録</div>
                <div class="card-meta" data-i18n="tourCreateMeta">新しいツアーを登録します</div>
                <p class="hint" style="margin:10px 0 0;" data-i18n="tourCreateHint">ツアーを作成して公開できます。</p>
            </a>

            <a class="card" href="/host/trips">
                <div class="card-title" data-i18n="tourManage">ツアー管理</div>
                <div class="card-meta" data-i18n="tourManageMeta">修正 / 削除</div>
                <p class="hint" style="margin:10px 0 0;" data-i18n="tourManageHint">自分が登録したツアーを管理できます。</p>
            </a>
        </div>

        <div class="panel" style="margin-top: 18px;">
            <h3 data-i18n="myTours">登録したツアー</h3>
            <p class="hint" data-i18n="myToursHint">自分が作成したツアーの日程と申請者を管理できます。</p>

            <div th:if="${!#lists.isEmpty(hostedTours)}">
                <div class="tour-card" th:each="t : ${hostedTours}" th:attr="data-trip-id=${t.tripId}">
                    <div class="tour-card-inner">
                        <h3 th:text="${t.title}">Trip Title</h3>

                        <p class="tour-meta">
                            <span th:text="${t.region}">JEJU</span>
                            ·
                            <span th:text="${#temporals.format(t.startAt, 'yyyy-MM-dd HH:mm')}"></span>
                            ~
                            <span th:text="${#temporals.format(t.endAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </p>

                        <div class="tour-actions">
                            <a class="btn btn-primary"
                               data-i18n="applicants"
                               th:href="@{/host/trips/{tripId}/applications(tripId=${t.tripId})}">
                                申請者確認
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="empty" th:if="${#lists.isEmpty(hostedTours)}" data-i18n="emptyTours">
                まだ登録したツアーがありません。
            </div>
        </div>

        <div class="panel">
            <h3 data-i18n="reviews">レビュー</h3>
            <p class="hint" data-i18n="reviewsHint">ツアー終了後に作成されたレビューが表示されます。</p>
                <div id="reviewList"></div>

                <div id="reviewEmpty" class="empty" data-i18n="emptyReviews" style="display:none;">
                    まだレビューがありません。
                </div>


        </div>
    </section>
</div>
<script src="/js/mypage-host-i18n.js"></script>
<script src="/js/mypage-details.js"></script>
<script src="/js/mypage-host-reviews.js"></script>

</body>
</html>
