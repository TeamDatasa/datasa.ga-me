<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Applications</title>
    <link rel="stylesheet" href="/css/users/mypage-applications.css"/>
</head>
<body>

<div class="page">
    <header class="topbar">
        <div class="brand">ga-me</div>
        <a class="btn btn-ghost" href="/mypage/details/user">Back</a>
    </header>

    <main class="container">
        <section class="card">
            <div class="card-head">
                <div>
                    <h1>My Applications</h1>
                    <p class="sub">Recent applications (pending/approved/rejected).</p>
                </div>
            </div>

            <div class="empty" th:if="${applications == null || #lists.isEmpty(applications)}">
                <div class="empty-box">
                    No applications yet.
                </div>
            </div>

            <div class="list" th:if="${applications != null && !#lists.isEmpty(applications)}">
                <article class="item" th:each="a : ${applications}">
                    <div class="item-left">
                        <div class="title" th:text="${a.tripTitle}">Trip title</div>

                        <div class="meta">
              <span class="pill"
                    th:classappend="${a.status.name() == 'PENDING'} ? ' pill-pending' :
                                    (${a.status.name() == 'APPROVED'} ? ' pill-approved' : ' pill-rejected')">
                <span th:text="${a.status}">PENDING</span>
              </span>
                        </div>
                    </div>

                    <div class="item-right">
                        <a class="btn btn-primary"
                           th:if="${a.status.name() == 'APPROVED'}"
                           th:href="@{/chat/room/{tripId}(tripId=${a.tripId})}">
                            Chat
                        </a>
                        <span th:if="${a.status.name() == 'PENDING'}"
                              class="hint">
              Waiting
            </span>
                        <span th:if="${a.status.name() == 'REJECTED'}"
                              class="hint">
              Rejected
            </span>
                    </div>
                </article>
            </div>
        </section>
    </main>
</div>

</body>
</html>
