<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Sign In</title>
    <link rel="stylesheet" href="/css/users/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <div class="auth-lang">
            <select id="langSelect" class="translate-select"></select>
        </div>
    </div>

    <h1 data-i18n="login.title">ログイン</h1>
    <p data-i18n="login.subtitle">お帰りなさい。ログインしてください。</p>

    <form id="loginForm" class="auth-form">
        <label data-i18n="login.emailLabel">メールアドレス</label>
        <input
                type="email"
                id="email"
                data-i18n-placeholder="login.emailPlaceholder"
                placeholder="email@example.com"
                required
        />

        <label data-i18n="login.passwordLabel">パスワード</label>
        <input
                type="password"
                id="password"
                data-i18n-placeholder="login.passwordPlaceholder"
                placeholder="Password"
                required
        />

        <button type="submit" class="auth-btn" data-i18n="login.submit">ログイン</button>
    </form>

    <div class="auth-footer">
        <a th:href="@{/auth/forgot-password}" class="forgot-link" data-i18n="login.forgot">
            パスワードをお忘れですか？
        </a>
    </div>

    <div class="auth-footer">
        <a href="/auth/signup" data-i18n="login.signup">会員登録</a>
    </div>
</div>

<script src="/js/auth-i18n-login.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
