<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/css/users/auth.css">
</head>
<body>

<main class="auth-page">
    <section class="auth-card">
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">We will send you a password reset link.</p>

        <form id="resetRequestForm" class="auth-form">
            <label class="auth-label" for="email">Email Address</label>
            <input class="auth-input" type="email" id="email" placeholder="email@example.com" required />

            <button class="auth-btn" type="submit">Send Reset Link</button>

            <p class="auth-linkline">
                Remember your password?
                <a class="auth-link" href="/login">Back to Sign In</a>
            </p>
        </form>

        <p id="msg" class="auth-msg"></p>
    </section>
</main>

<script>
    document.getElementById("resetRequestForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;

      const res = await fetch("/api/auth/password/reset-request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });

      const msgEl = document.getElementById("msg");

      if (res.ok) {
        msgEl.classList.remove("is-error");
        msgEl.classList.add("is-success");
        msgEl.innerText = "If the email exists, a reset link has been sent.";
      } else {
        msgEl.classList.remove("is-success");
        msgEl.classList.add("is-error");
        msgEl.innerText = "Failed to send the reset link. Please try again.";
      }
    });
</script>

</body>
</html>
