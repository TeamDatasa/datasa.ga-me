<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>Reset Password</title>
    <link rel="stylesheet" href="/css/users/auth.css"/>
</head>
<body>
<div class="auth-container">
    <h1>Reset Password</h1>
    <p>Create a new password.</p>

    <form id="resetForm" class="auth-form">
        <label>New Password</label>
        <input type="password" id="p1" minlength="8" required />

        <label>Confirm Password</label>
        <input type="password" id="p2" minlength="8" required />

        <button class="auth-btn" type="submit">Reset</button>
        <p id="msg" class="hint" style="margin-top:10px;"></p>
    </form>

    <div class="auth-footer">
        <a href="/auth/login">Go to Sign In</a>
    </div>
</div>

<script src="/js/reset-password.js"></script>
</body>
</html>
