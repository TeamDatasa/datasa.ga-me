<!--comment-->
<hr style="margin:24px 0;"/>

<div class="comment-wrap">
    <div class="comment-header">
        <div>
            <h2 style="margin:0;">댓글</h2>
            <div class="hint">로그인이 없으므로 userId(1~10)를 더미로 입력해서 테스트합니다.</div>
        </div>
        <div class="small" id="commentCountText"></div>
    </div>

    <div class="comment-form">
        <div class="comment-form-row">
            <label class="muted" for="dummyUserId">userId</label>
            <input id="dummyUserId" type="number" min="1" max="10" value="1" />
            <span class="muted" id="replyTargetText">최상위 댓글 작성</span>
            <button type="button" id="cancelReplyBtn" class="hidden">대댓글 취소</button>
        </div>

        <input type="hidden" id="parentCommentId" value="" />
        <textarea id="commentContent" placeholder="댓글 내용을 입력하세요"></textarea>

        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" id="submitCommentBtn">댓글 등록</button>
            <span class="muted" id="formMsg"></span>
        </div>
    </div>

    <div class="comment-list" id="commentList"></div>
</div>
