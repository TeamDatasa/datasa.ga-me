<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/listAll.css}">
    <link rel="stylesheet" th:href="@{/css/notifications.css(v=${#dates.createNow().time})}"/>
    <script defer th:src="@{/js/notifications.js(v=${#dates.createNow().time})}"></script>

    <title>Trip List</title>
</head>

<body>
<div th:replace="~{fragments/topbar :: notifTopbar}"></div>

<div class="top-bar">
    <h1>전체 작성글 리스트</h1>
    <a th:href="@{/api/trip/write}">게시글 작성</a>
</div>

<div th:if="${boardList == null or #lists.isEmpty(boardList)}" class="muted">
    아직 작성된 게시글이 없습니다.
</div>

<table th:if="${boardList != null and !#lists.isEmpty(boardList)}">
    <thead>
    <tr>
        <th class="nowrap">ID</th>
        <th>제목</th>
        <th class="nowrap">호스트</th>
        <th class="nowrap">상태</th>
        <th class="nowrap">시작</th>
        <th class="nowrap">종료</th>
        <th class="nowrap">인원</th>
        <th class="nowrap">소요(분)</th>
        <th class="nowrap">비용(KRW)</th>
        <th class="nowrap">작성일</th>
        <th class="nowrap">좋아요</th>
        <th class="nowrap">삭제</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="trip : ${boardList}">
        <td class="nowrap" th:text="${trip.tripId}">1</td>

        <td>
            <div>
                <a th:href="@{/api/trip/detail/{id}(id=${trip.tripId})}">
                    <strong th:text="${trip.title}">제목</strong>
                </a>
            </div>

            <div class="muted desc" th:if="${trip.description == null}">-</div>

            <div class="muted desc"
                 th:if="${trip.description != null and trip.description.length() <= 80}"
                 th:text="${trip.description}">
                설명
            </div>

            <div class="muted desc"
                 th:if="${trip.description != null and trip.description.length() > 80}"
                 th:text="${trip.description.substring(0, 80) + '...'}">
                설명
            </div>
        </td>

        <td class="nowrap">
            <div th:text="${trip.hostName}">호스트명</div>
            <div class="muted" th:text="'ID: ' + ${trip.hostUserId}">ID: 1</div>
        </td>

        <td class="nowrap">
            <span class="badge" th:text="${trip.status}">OPEN</span>
        </td>

        <td class="nowrap" th:text="${#temporals.format(trip.startAt, 'yyyy-MM-dd HH:mm')}">-</td>
        <td class="nowrap" th:text="${#temporals.format(trip.endAt, 'yyyy-MM-dd HH:mm')}">-</td>

        <td class="nowrap" th:text="${trip.maxParticipants}">10</td>
        <td class="nowrap" th:text="${trip.durationMinutes}">120</td>

        <td class="nowrap"
            th:text="${trip.estimatedCost != null ? #numbers.formatInteger(trip.estimatedCost, 0, 'COMMA') : '-'}">
            -
        </td>

        <td class="nowrap" th:text="${#temporals.format(trip.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>

        <!-- 좋아요 -->
        <td class="nowrap">
            <button type="button"
                    class="like-btn"
                    th:attr="data-trip-id=${trip.tripId}, data-liked=${trip.likedByMe}"
                    onclick="toggleTripLike(this)">
                <span class="heart" th:text="${trip.likedByMe} ? '❤' : '♡'">♡</span>
                <span class="like-count" th:text="${trip.likeCount}">0</span>
            </button>
        </td>

        <!-- 삭제 -->
        <td class="nowrap">
            <form th:action="@{/api/trip/delete/{id}(id=${trip.tripId})}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');"
                  style="display:inline;">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script>
    async function toggleTripLike(btn) {
        const tripId = btn.getAttribute("data-trip-id");
        btn.disabled = true;

        try {
            const res = await fetch(`/api/trip/${tripId}/like`, {
                method: "POST",
                headers: { "Accept": "application/json" }
            });

            if (!res.ok) throw new Error(res.status);

            const data = await res.json(); // {liked: boolean, count: number}
            btn.setAttribute("data-liked", String(data.liked));
            btn.querySelector(".heart").innerText = data.liked ? "❤" : "♡";
            btn.querySelector(".like-count").innerText = data.count;

        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
