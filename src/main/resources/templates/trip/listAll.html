<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" th:href="@{/css/listAll.css}">
    <link rel="stylesheet" th:href="@{/css/notifications.css(v=${#dates.createNow().time})}"/>
    <script defer th:src="@{/js/notifications.js(v=${#dates.createNow().time})}"></script>

    <title>Trip List</title>
</head>

<body>
<div th:replace="~{fragments/topbar :: notifTopbar}"></div>

<div class="top-bar">
    <h1>전체 작성글 리스트</h1>

    <!-- UI는 노출, 클릭 시 role 체크 -->
    <a id="writeTripLink" th:href="@{/api/trip/write}">게시글 작성</a>
</div>

<div th:if="${boardList == null or #lists.isEmpty(boardList)}" class="muted">
    아직 작성된 게시글이 없습니다.
</div>

<table th:if="${boardList != null and !#lists.isEmpty(boardList)}">
    <thead>
    <tr>
        <th class="nowrap">ID</th>
        <th>제목</th>
        <th class="nowrap">호스트</th>
        <th class="nowrap">상태</th>
        <th class="nowrap">시작</th>
        <th class="nowrap">종료</th>
        <th class="nowrap">인원</th>
        <th class="nowrap">소요(분)</th>
        <th class="nowrap">비용(KRW)</th>
        <th class="nowrap">작성일</th>
        <th class="nowrap">좋아요</th>
        <th class="nowrap">삭제</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="trip : ${boardList}">
        <!-- 1) ID -->
        <td class="nowrap" th:text="${trip.tripId}">1</td>

        <!-- 2) 제목 -->
        <td>
            <a th:href="@{/api/trip/detail/{id}(id=${trip.tripId})}">
                <strong th:text="${trip.title}">제목</strong>
            </a>
        </td>

        <!-- 3) 호스트 -->
        <td class="nowrap" th:text="${trip.hostName}">호스트명</td>

        <!-- 4) 상태 -->
        <td class="nowrap">
            <span class="badge" th:text="${trip.status}">OPEN</span>
        </td>

        <!-- 5) 시작 -->
        <td class="nowrap" th:text="${trip.startAt != null ? #temporals.format(trip.startAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>

        <!-- 6) 종료 -->
        <td class="nowrap" th:text="${trip.endAt != null ? #temporals.format(trip.endAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>

        <!-- 7) 인원 -->
        <td class="nowrap" th:text="${trip.maxParticipants}">10</td>

        <!-- 8) 소요 -->
        <td class="nowrap" th:text="${trip.durationMinutes}">120</td>

        <!-- 9) 비용 -->
        <td class="nowrap"
            th:text="${trip.estimatedCost != null ? #numbers.formatInteger(trip.estimatedCost, 0, 'COMMA') : '-'}">
            -
        </td>

        <!-- 10) 작성일 -->
        <td class="nowrap" th:text="${trip.createdAt != null ? #temporals.format(trip.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</td>

        <!-- 11) 좋아요 -->
        <td class="nowrap">
            <button type="button"
                    class="like-btn"
                    th:attr="data-trip-id=${trip.tripId}, data-liked=${trip.likedByMe}"
                    onclick="toggleTripLike(this)">
                <span class="heart" th:text="${trip.likedByMe} ? '❤' : '♡'">♡</span>
                <span class="like-count" th:text="${trip.likeCount}">0</span>
            </button>
        </td>

        <!-- 12) 삭제 -->
        <td class="nowrap">
            <form th:action="@{/api/trip/delete/{id}(id=${trip.tripId})}" method="post"
                  onsubmit="return confirm('삭제하시겠습니까?');"
                  style="display:inline;">
                <button type="submit">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script>
    // 게시글 작성 클릭 시 role 검사 (가이드=HOST만 허용)
    document.addEventListener("DOMContentLoaded", () => {
        const writeLink = document.getElementById("writeTripLink");
        if (!writeLink) return;

        writeLink.addEventListener("click", (e) => {
            const token = localStorage.getItem("accessToken");
            const role = localStorage.getItem("role"); // USER / HOST

            if (!token || !token.trim()) {
                e.preventDefault();
                alert("로그인 후 이용 가능합니다.");
                window.location.href = "/login";
                return;
            }

            if (role !== "HOST") {
                e.preventDefault();
                alert("역할이 가이드일 경우에만 작성 가능합니다. 마이페이지에서 역할 신청을 해주세요");
                window.location.href = "/mypage";
            }
        });
    });

    async function toggleTripLike(btn) {
        const tripId = btn.getAttribute("data-trip-id");
        btn.disabled = true;

        try {
            const res = await fetch(`/api/trip/${tripId}/like`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
            });

            if (!res.ok) {
                alert("좋아요 처리에 실패했습니다.");
                return;
            }

            window.location.reload();
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
