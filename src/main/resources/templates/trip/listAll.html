<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/trip-list.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/trip-like.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <link rel="stylesheet" th:href="@{/css/host-card-modal.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/footer.css(v=${#dates.createNow().time})}">

    <title>여행 목록</title>
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="page">
    <div class="container">

        <div class="trip-list-head">
            <h1>여행 목록</h1>

            <div class="trip-list-actions">
                <a class="yw-btn yw-btn--primary" href="/trip/write">여정 작성</a>
            </div>
        </div>

        <section class="trip-cards">
            <article class="trip-card" th:each="trip : ${boardList}"
                     th:onclick="|location.href='/trip/detail/' + ${trip.tripId}|">
                <div class="trip-card__body">
                    <div class="trip-card__title" th:text="${trip.title}">제목</div>
                    <div class="trip-card__meta">
                        <span th:text="${trip.region}">지역</span>
                        <span class="dot">•</span>
                        <span th:text="${trip.theme}">테마</span>
                    </div>

                    <div class="trip-card__desc" th:text="${trip.description}">설명</div>
                </div>

                <div class="trip-card__footer" onclick="event.stopPropagation();">
                    <!-- ✅ 좋아요 버튼 (공용 규격) -->
                    <button class="like-btn"
                            type="button"
                            data-like-btn
                            th:attr="data-trip-id=${trip.tripId},
                           data-liked=${trip.likedByMe},
                           data-count=${trip.likeCount}">
                        <span class="like-btn__icon" data-like-icon
                              th:text="${trip.likedByMe} ? '♥' : '♡'">♡</span>
                        <span class="like-btn__count" data-like-count
                              th:text="${trip.likeCount}">0</span>
                    </button>

                    <span class="trip-card__host">
                        <a href="#"
                           class="hc-host-link"
                           data-host-card-open
                           th:attr="data-host-id=${trip.hostUserId}"
                           th:text="${trip.hostName}">호스트</a>
                    </span>
                </div>
            </article>

            <div class="empty" th:if="${boardList == null || #lists.isEmpty(boardList)}">
                등록된 여정이 없습니다.
            </div>
        </section>

    </div>
</main>

<!-- ✅ Host Card Modal (페이지 1회) -->
<div id="hostCardModalOverlay" class="hc-overlay" aria-hidden="true">
    <div class="hc-modal" role="dialog" aria-modal="true" aria-labelledby="hcTitle">
        <div class="hc-head">
            <div id="hcTitle" class="hc-title">호스트 프로필</div>
            <button id="hostCardModalClose" type="button" class="hc-close">닫기</button>
        </div>
        <div class="hc-body">
            <h3 id="hcName" class="hc-name">-</h3>
            <div id="hcMeta" class="hc-meta"></div>
            <div id="hcBio" class="hc-bio"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/authFetch.js}"></script>
<script th:src="@{/js/main-auth.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/trip-like.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/host-card-modal.js(v=${#dates.createNow().time})}"></script>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script th:src="@{/js/footer.js(v=${#dates.createNow().time})}"></script>


</body>
</html>
