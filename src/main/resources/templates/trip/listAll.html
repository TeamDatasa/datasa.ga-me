<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/trip-list.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/trip-like.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <link rel="stylesheet" th:href="@{/css/host-card-modal.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/footer.css(v=${#dates.createNow().time})}">

    <title>여행 목록</title>
</head>
<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="page">
    <div class="container">

        <div class="trip-list-head">
            <h2>여행 목록</h2>
            <a class="tl-write-btn" href="/trip/write">여정 작성</a>
        </div>

        <!-- 메인과 동일한 필터/정렬 -->
        <form id="listFilterForm" class="yw-filter" method="get" action="/trip/listAll"
              th:attr="data-selected-province=${selectedProvince},
                       data-selected-region=${selectedRegion},
                       data-selected-theme=${selectedTheme},
                       data-selected-order=${selectedOrder}">
            <input type="hidden" name="order" id="orderInput" th:value="${selectedOrder} ?: 'latest'"/>

            <div class="yw-filter__box">
                <strong>언어</strong>
                <span class="yw-muted">(복수 선택)</span>
                <label>
                    <input type="checkbox" class="lang" name="languages" value="KOREAN"
                           th:checked="${selectedLanguages != null and selectedLanguages.contains('KOREAN')}"> 한국어
                </label>
                <label>
                    <input type="checkbox" class="lang" name="languages" value="ENGLISH"
                           th:checked="${selectedLanguages != null and selectedLanguages.contains('ENGLISH')}"> 영어
                </label>
                <label>
                    <input type="checkbox" class="lang" name="languages" value="JAPANESE"
                           th:checked="${selectedLanguages != null and selectedLanguages.contains('JAPANESE')}"> 일본어
                </label>
            </div>

            <div class="yw-filter__box">
                <strong>지역</strong>
                <select id="province" name="province">
                    <option value="">전체(도)</option>
                </select>
                <select id="region" name="region">
                    <option value="">전체(시)</option>
                </select>
            </div>

            <div class="yw-filter__box">
                <strong>테마</strong>
                <select id="theme" name="theme">
                    <option value="">전체</option>
                    <option value="FOOD" th:selected="${selectedTheme} == 'FOOD'">맛집</option>
                    <option value="NATURE" th:selected="${selectedTheme} == 'NATURE'">자연</option>
                    <option value="CITY" th:selected="${selectedTheme} == 'CITY'">도시</option>
                    <option value="CULTURE" th:selected="${selectedTheme} == 'CULTURE'">문화</option>
                    <option value="NIGHT" th:selected="${selectedTheme} == 'NIGHT'">야경</option>
                </select>
            </div>

            <div class="yw-filter__box">
                <strong>정렬</strong>
                <button id="latestBtn" type="button"
                        th:classappend="${selectedOrder} == null or ${selectedOrder} == 'latest' ? 'active' : ''">
                    최신순
                </button>
                <button id="popularBtn" type="button"
                        th:classappend="${selectedOrder} == 'popular' ? 'active' : ''">
                    인기순
                </button>
            </div>
        </form>

        <section class="trip-cards" id="tripList">
            <article class="trip-card" th:each="trip : ${boardList}"
                     th:onclick="|location.href='/trip/detail/' + ${trip.tripId}|">

                <div class="trip-card__body">
                    <div class="trip-card__title-row">
                        <div class="trip-card__title" th:text="${trip.title}">제목</div>

                        <div class="trip-card__status" th:with="st=${trip.status != null ? trip.status.name() : ''}">
                            <span class="tl-pill"
                                  th:classappend="${st} == 'OPEN' ? ' tl-pill--open' :
                                                  (${st} == 'IN_PROGRESS' ? ' tl-pill--progress' :
                                                  (${st} == 'CLOSED' ? ' tl-pill--closed' :
                                                  (${st} == 'FINISHED' ? ' tl-pill--finished' :
                                                  (${st} == 'DRAFT' ? ' tl-pill--draft' : ' tl-pill--draft'))))">
                                <span th:switch="${st}">
                                    <span th:case="'DRAFT'">임시저장</span>
                                    <span th:case="'OPEN'">모집중</span>
                                    <span th:case="'CLOSED'">모집마감</span>
                                    <span th:case="'IN_PROGRESS'">진행중</span>
                                    <span th:case="'FINISHED'">종료됨</span>
                                    <span th:case="*">-</span>
                                </span>
                            </span>
                        </div>
                    </div>

                    <div class="trip-card__meta">
                        <span class="tl-chip" th:text="${trip.region} ?: '지역 미정'">지역</span>

                        <th:block th:if="${trip.languageCodes != null} and ${!trip.languageCodes.isEmpty()}">
                            <th:block th:each="code : ${trip.languageCodes}">
                                <span class="tl-chip" th:switch="${code}">
                                    <span th:case="'KOREAN'">한국어</span>
                                    <span th:case="'ENGLISH'">영어</span>
                                    <span th:case="'JAPANESE'">일본어</span>
                                    <span th:case="*" th:text="${code}">-</span>
                                </span>
                            </th:block>
                        </th:block>

                        <span class="tl-chip" th:switch="${trip.theme}">
                            <span th:case="'FOOD'">맛집</span>
                            <span th:case="'NATURE'">자연</span>
                            <span th:case="'CITY'">도시</span>
                            <span th:case="'CULTURE'">문화</span>
                            <span th:case="'NIGHT'">야경</span>
                            <span th:case="*" th:text="${trip.theme} ?: '-'">-</span>
                        </span>

                        <span class="dot">•</span>
                        <span class="tl-people"
                              th:text="${trip.currentParticipants + '/' + trip.maxParticipants}">1/3</span>
                    </div>

                    <div class="trip-card__desc" th:text="${trip.description}">설명</div>
                </div>

                <div class="trip-card__footer" onclick="event.stopPropagation();">
                    <button class="like-btn"
                            type="button"
                            data-like-btn
                            th:attr="data-trip-id=${trip.tripId},
                           data-liked=${trip.likedByMe},
                           data-count=${trip.likeCount}">
                        <span class="like-btn__icon" data-like-icon
                              th:text="${trip.likedByMe} ? '♥' : '♡'">♡</span>
                        <span class="like-btn__count" data-like-count
                              th:text="${trip.likeCount}">0</span>
                    </button>

                    <span class="trip-card__host" onclick="event.stopPropagation();">
                        <span class="hc-host-deleted" th:if="${trip.hostDeleted}">
                            탈퇴한 사용자
                        </span>

                        <a href="#"
                           class="hc-host-link"
                           data-host-card-open
                           th:if="${!trip.hostDeleted}"
                           th:attr="data-host-id=${trip.hostUserId}"
                           th:text="${trip.hostName}">
                            호스트
                        </a>
                    </span>
                </div>
            </article>

            <div class="empty" th:if="${boardList == null || #lists.isEmpty(boardList)}">
                등록된 여정이 없습니다.
            </div>
        </section>

    </div>
</main>

<div id="hostCardModalOverlay" class="hc-overlay" aria-hidden="true">
    <div class="hc-modal" role="dialog" aria-modal="true" aria-labelledby="hcTitle">
        <div class="hc-head">
            <div id="hcTitle" class="hc-title">호스트 프로필</div>
            <button id="hostCardModalClose" type="button" class="hc-close">닫기</button>
        </div>

        <div class="hc-body">
            <div class="hc-profile">
                <img id="hcAvatar" class="hc-avatar" alt="호스트 프로필 이미지"/>
                <div class="hc-profile__main">
                    <h3 id="hcName" class="hc-name">-</h3>
                    <div id="hcMeta" class="hc-meta"></div>
                </div>
            </div>

            <div id="hcBio" class="hc-bio"></div>
        </div>
    </div>
</div>

<script th:src="@{/js/authFetch.js}"></script>
<script th:src="@{/js/main-auth.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/notifications.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/trip-like.js(v=${#dates.createNow().time})}"></script>
<script th:src="@{/js/host-card-modal.js(v=${#dates.createNow().time})}"></script>

<script th:src="@{/js/trip-list-filter.js(v=${#dates.createNow().time})}"></script>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script th:src="@{/js/footer.js(v=${#dates.createNow().time})}"></script>

</body>
</html>
