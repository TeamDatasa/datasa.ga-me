<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" th:href="@{/css/host/trip-write.css}"/>
    <link rel="stylesheet" th:href="@{/css/notifications.css}"/>
    <link rel="stylesheet" th:href="@{/css/footer.css(v=${#dates.createNow().time})}"/>

    <title>旅行投稿作成</title>

    <!-- Kakao Maps SDK (autoload=false) -->
    <script th:if="${jsKey != null}"
            th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${jsKey},libraries='services',autoload='false')}"></script>
</head>

<body>
<div th:replace="~{fragments/header :: siteHeader}"></div>

<h1 class="tw-title">旅行投稿作成</h1>

<form class="tw-form" th:action="@{/trip/write}" method="post" th:object="${request}">

    <div class="tw-field">
        <label for="title">タイトル</label><br/>
        <input id="title" type="text" th:field="*{title}" maxlength="120" required/>
    </div>

    <div class="tw-field">
        <label for="description">説明</label><br/>
        <textarea id="description" th:field="*{description}" rows="6" cols="60" required></textarea>
    </div>

    <div class="tw-field">
        <label>対応言語（複数選択可）</label><br/>
        <div class="tw-check-group">
            <label class="tw-check">
                <input type="checkbox" th:field="*{languageCodes}" value="KOREAN"/>
                <span>韓国語</span>
            </label>
            <label class="tw-check">
                <input type="checkbox" th:field="*{languageCodes}" value="ENGLISH"/>
                <span>英語</span>
            </label>
            <label class="tw-check">
                <input type="checkbox" th:field="*{languageCodes}" value="JAPANESE"/>
                <span>日本語</span>
            </label>
        </div>
        <div class="tw-help">対応言語は1つ以上選択してください。</div>
    </div>

    <div class="tw-field">
        <label for="theme">テーマ</label><br/>
        <select id="theme" th:field="*{theme}" required>
            <option value="" disabled selected>選択してください</option>

            <option value="FOOD">グルメ</option>
            <option value="NATURE">自然</option>
            <option value="CITY">都市</option>
            <option value="CULTURE">文化</option>
            <option value="NIGHT">夜景</option>
            <option value="HEALING">癒やし</option>
            <option value="ACTIVITY">アクティビティ</option>
            <option value="SHOPPING">ショッピング</option>
            <option value="OTHER">その他（直接入力）</option>
        </select>

        <!-- その他 입력 -->
        <div id="themeCustomWrap" style="display:none; margin-top:10px;">
            <input id="themeCustom" type="text" th:field="*{themeCustom}" maxlength="9"
                   placeholder="10文字未満で直接入力"/>
            <div class="tw-help">その他は10文字未満で入力してください。</div>
        </div>
    </div>

    <div class="tw-field">
        <label>地域</label><br/>
        <div class="tw-row">
            <div class="tw-col">
                <label for="province" class="tw-sub-label">道</label>
                <select id="province" required>
                    <option value="" disabled selected>選択してください</option>
                </select>
            </div>
            <div class="tw-col">
                <label for="region" class="tw-sub-label">市</label>
                <select id="region" th:field="*{region}" required th:attr="data-initial=*{region}">
                    <option value="" disabled selected>先に道を選択してください</option>
                </select>
            </div>
        </div>
        <div class="tw-help">道を選択すると、その道に含まれる市の一覧が表示されます。</div>
    </div>

    <div class="tw-field">
        <label for="startAt">開始日時</label><br/>
        <input id="startAt" type="datetime-local" th:field="*{startAt}" required/>
        <div class="tw-help">投稿作成時点から24時間以降のみ選択できます。</div>
    </div>

    <div class="tw-field">
        <label for="endAt">終了日時</label><br/>
        <input id="endAt" type="datetime-local" th:field="*{endAt}" required/>
        <div class="tw-help">終了日時は開始日時より前に設定できず、開始時刻から30分後以降のみ選択できます。</div>
    </div>

    <div class="tw-field">
        <label for="durationMinutes">所要時間（分）</label><br/>
        <input id="durationMinutes" type="number" th:field="*{durationMinutes}" min="1" step="1" required readonly/>
        <div class="tw-help">開始・終了日時を基準に自動計算されます。</div>
    </div>

    <div class="tw-field">
        <label for="estimatedCost">予想費用(KRW)</label><br/>
        <input id="estimatedCost" type="number" th:field="*{estimatedCost}" min="0" step="1000"
               placeholder="1,000ウォン単位で入力"/>
    </div>

    <div class="tw-field">
        <label for="maxParticipants">最大人数</label><br/>
        <input id="maxParticipants" type="number" th:field="*{maxParticipants}" min="1" step="1" required/>
    </div>

    <!-- ================== MAP ================== -->
    <section class="tw-map-section">
        <div class="tw-section-title">場所検索</div>

        <div class="tw-place-search">
            <input id="keyword" type="text"
                   placeholder="例：釜山駅"
                   onkeydown="if(event.key==='Enter'){ event.preventDefault(); searchPlaces(); }"/>
            <button type="button" onclick="searchPlaces()">検索</button>
        </div>

        <!-- 2열: 지道 + 検索결과 (동일 높이) -->
        <div class="tw-map-grid">
            <div id="map"></div>

            <div class="tw-map-side">
                <div class="tw-result-box">
                    <div class="tw-mini-title">検索結果</div>
                    <ul id="placesList"></ul>
                    <div id="pagination"></div>
                </div>
            </div>
        </div>

        <!-- 아래 1열: 日程(가로로 길게) -->
        <div class="tw-schedule-wide">
            <div class="tw-mini-title">日程（選択した場所一覧）</div>

            <div id="scheduleList">
                <div style="color:#888; font-size:13px;" id="scheduleEmptyText">
                    まだ追加された日程がありません。地図で場所をクリックして追加してください。
                </div>
            </div>

            <div id="scheduleHiddenFieldsServer" style="display:none;">
                <th:block th:if="${request.schedulePlaces != null}">
                    <th:block th:each="p, stat : ${request.schedulePlaces}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].placeId'" th:value="${p.placeId}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].placeName'" th:value="${p.placeName}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].address'" th:value="${p.address}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].lat'" th:value="${p.lat}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].lng'" th:value="${p.lng}">
                    </th:block>
                </th:block>
            </div>

            <div id="scheduleHiddenFields"></div>
        </div>

        <input type="hidden" name="placeName" id="placeName">
        <input type="hidden" name="placeId" id="placeId">
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">
        <input type="hidden" name="address" id="address">
    </section>
    <!-- ================== /MAP ================== -->

    <div class="tw-actions">
        <button type="submit">登録</button>
        <button type="button" class="btn-cancel" onclick="location.href='/trip/listAll'">一覧</button>
    </div>

    <div id="serverError" th:if="${errorMessage != null}" th:attr="data-message=${errorMessage}" style="display:none;"></div>

</form>

<script th:src="@{/js/authFetch.js}"></script>
<script th:src="@{/js/main-auth.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/trip-write.js}"></script>

<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script th:src="@{/js/footer.js(v=${#dates.createNow().time})}"></script>
</body>
</html>
