<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/css/host/trip-write.css"/>

    <title>여행 글 작성</title>

    <!-- Kakao Maps SDK (Thymeleaf 안전 로드 + autoload=false) -->
    <script th:if="${jsKey != null}"
            th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${jsKey},libraries='services',autoload='false')}"></script>
    <link rel="stylesheet" th:href="@{/css/footer.css(v=${#dates.createNow().time})}">

</head>

<body>
<h1 class="tw-title">여행 글 작성</h1>

<form class="tw-form" th:action="@{/trip/write}" method="post" th:object="${request}">

    <div class="tw-field">
        <label for="title">제목</label><br/>
        <input id="title" type="text" th:field="*{title}" maxlength="120" required/>
    </div>

    <div class="tw-field">
        <label for="description">설명</label><br/>
        <textarea id="description" th:field="*{description}" rows="6" cols="60" required></textarea>
    </div>

    <div class="tw-field">
        <label for="region">지역(시)</label><br/>
        <select id="region" th:field="*{region}" required>
            <option value="" disabled selected>선택하세요</option>
            <option value="가평">가평</option>
            <option value="강릉">강릉</option>
            <option value="거제">거제</option>
            <option value="경주">경주</option>
            <option value="고성">고성</option>
            <option value="공주">공주</option>
            <option value="광양">광양</option>
            <option value="광주">광주</option>
            <option value="구미">구미</option>
            <option value="군산">군산</option>
            <option value="김천">김천</option>
            <option value="김포">김포</option>
            <option value="김해">김해</option>
            <option value="나주">나주</option>
            <option value="남양주">남양주</option>
            <option value="남원">남원</option>
            <option value="논산">논산</option>
            <option value="당진">당진</option>
            <option value="대구">대구</option>
            <option value="대전">대전</option>
            <option value="동두천">동두천</option>
            <option value="동해">동해</option>
            <option value="목포">목포</option>
            <option value="무안">무안</option>
            <option value="밀양">밀양</option>
            <option value="보령">보령</option>
            <option value="보성">보성</option>
            <option value="부산">부산</option>
            <option value="부여">부여</option>
            <option value="부천">부천</option>
            <option value="사천">사천</option>
            <option value="상주">상주</option>
            <option value="서귀포">서귀포</option>
            <option value="서울">서울</option>
            <option value="서산">서산</option>
            <option value="성남">성남</option>
            <option value="세종">세종</option>
            <option value="속초">속초</option>
            <option value="수원">수원</option>
            <option value="순천">순천</option>
            <option value="시흥">시흥</option>
            <option value="안동">안동</option>
            <option value="안산">안산</option>
            <option value="안성">안성</option>
            <option value="안양">안양</option>
            <option value="양산">양산</option>
            <option value="양양">양양</option>
            <option value="여수">여수</option>
            <option value="연천">연천</option>
            <option value="영월">영월</option>
            <option value="영주">영주</option>
            <option value="영천">영천</option>
            <option value="오산">오산</option>
            <option value="완도">완도</option>
            <option value="용인">용인</option>
            <option value="울산">울산</option>
            <option value="원주">원주</option>
            <option value="익산">익산</option>
            <option value="인천">인천</option>
            <option value="전주">전주</option>
            <option value="정선">정선</option>
            <option value="제주">제주</option>
            <option value="제천">제천</option>
            <option value="창원">창원</option>
            <option value="천안">천안</option>
            <option value="청주">청주</option>
            <option value="춘천">춘천</option>
            <option value="충주">충주</option>
            <option value="통영">통영</option>
            <option value="파주">파주</option>
            <option value="포항">포항</option>
            <option value="하남">하남</option>
            <option value="화성">화성</option>
        </select>
    </div>

    <div class="tw-field">
        <label for="estimatedCost">예상 비용(KRW)</label><br/>
        <input id="estimatedCost" type="number" th:field="*{estimatedCost}" min="0" step="1000"/>
    </div>

    <div class="tw-field">
        <label for="maxParticipants">최대 인원</label><br/>
        <input id="maxParticipants" type="number" th:field="*{maxParticipants}" min="1" step="1" required/>
    </div>

    <div class="tw-field">
        <label for="durationMinutes">소요 시간(분)</label><br/>
        <input id="durationMinutes" type="number" th:field="*{durationMinutes}" min="1" step="1" required/>
    </div>

    <div class="tw-field">
        <label for="theme">테마</label><br/>
        <select id="theme" th:field="*{theme}" required>
            <option value="" disabled selected>선택하세요</option>
            <option value="FOOD">맛집</option>
            <option value="NATURE">자연</option>
            <option value="CITY">도시</option>
            <option value="CULTURE">문화</option>
            <option value="NIGHT">야경</option>
        </select>
    </div>

    <div class="tw-field">
        <label for="startAt">시작 일자/시간</label><br/>
        <input id="startAt" type="datetime-local" th:field="*{startAt}" required/>
    </div>

    <div class="tw-field">
        <label for="endAt">끝나는 일자/시간</label><br/>
        <input id="endAt" type="datetime-local" th:field="*{endAt}" required/>
    </div>

    <!-- ================== MAP (기능 동일, UI만 정리) ================== -->
    <section class="tw-map-section">
        <div class="tw-section-title">장소 검색</div>

        <div class="tw-place-search">
            <input id="keyword" type="text"
                   placeholder="예: 부산역"
                   onkeydown="if(event.key==='Enter'){ event.preventDefault(); searchPlaces(); }"/>
            <button type="button" onclick="searchPlaces()">검색</button>
        </div>

        <div class="tw-map-grid">
            <div id="map"></div>

            <div class="tw-result-box">
                <div class="tw-mini-title">검색 결과</div>
                <ul id="placesList"></ul>
                <div id="pagination"></div>
            </div>
        </div>

        <!-- 선택된 장소 1개 전송용 -->
        <input type="hidden" name="placeName" id="placeName">
        <input type="hidden" name="placeId" id="placeId">
        <input type="hidden" name="lat" id="lat">
        <input type="hidden" name="lng" id="lng">
        <input type="hidden" name="address" id="address">

        <div class="tw-picked">
            선택된 장소: <span id="pickedText">아직 선택되지 않았습니다.</span>
        </div>

        <!-- 일정 목록 UI -->
        <div class="tw-schedule-box">
            <div class="tw-mini-title">일정(선택한 장소 목록)</div>

            <div id="scheduleList">
                <div style="color:#888; font-size:13px;" id="scheduleEmptyText">
                    아직 추가된 일정이 없습니다. 지도에서 장소를 클릭해 추가해 주세요.
                </div>
            </div>

            <!-- ✅ 서버에서 넘어온 schedulePlaces 복원용(읽기 전용) -->
            <div id="scheduleHiddenFieldsServer" style="display:none;">
                <th:block th:if="${request.schedulePlaces != null}">
                    <th:block th:each="p, stat : ${request.schedulePlaces}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].placeId'" th:value="${p.placeId}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].placeName'" th:value="${p.placeName}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].address'" th:value="${p.address}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].lat'" th:value="${p.lat}">
                        <input type="hidden" th:name="'schedulePlaces[' + ${stat.index} + '].lng'" th:value="${p.lng}">
                    </th:block>
                </th:block>
            </div>

            <!-- ✅ JS가 제출용 hidden input들을 여기에 동적으로 생성 -->
            <div id="scheduleHiddenFields"></div>
        </div>
    </section>
    <!-- ================== /MAP ================== -->

    <div class="tw-actions">
        <button type="submit">등록</button>
        <button type="button" class="btn-cancel" onclick="location.href='/trip/listAll'">목록</button>
    </div>

</form>

<script>
    let map, ps, infowindow;
    let markers = [];

    // 일정 목록 상태
    // { placeId, placeName, address, lat, lng }
    let schedulePlaces = [];

    function initKakaoMap() {
        map = new kakao.maps.Map(document.getElementById('map'), {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 3
        });

        ps = new kakao.maps.services.Places(map);
        infowindow = new kakao.maps.InfoWindow({zIndex: 1});
    }

    // SDK 로드 완료 후에만 초기화 (autoload=false 대응)
    if (window.kakao && kakao.maps && typeof kakao.maps.load === 'function') {
        kakao.maps.load(function () {
            initKakaoMap();
        });
    }

    function searchPlaces() {
        const keyword = document.getElementById('keyword').value.trim();
        if (!keyword) return;
        ps.keywordSearch(keyword, placesSearchCB);
    }

    function placesSearchCB(data, status, pagination) {
        if (status !== kakao.maps.services.Status.OK) {
            clearResults();
            return;
        }
        displayPlaces(data);
        displayPagination(pagination);
    }

    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();

        clearMarkers();
        listEl.innerHTML = '';

        places.forEach((place) => {
            const position = new kakao.maps.LatLng(place.y, place.x);
            bounds.extend(position);

            const marker = addMarker(position);
            const itemEl = makeListItem(place);

            itemEl.addEventListener('click', () => selectPlace(place, position));
            kakao.maps.event.addListener(marker, 'click', () => selectPlace(place, position));

            listEl.appendChild(itemEl);
        });

        map.setBounds(bounds);
    }

    function makeListItem(place) {
        const li = document.createElement('li');

        const addr = place.road_address_name || place.address_name || '';
        li.innerHTML = `
          <div style="font-weight:bold;">${escapeHtml(place.place_name)}</div>
          <div style="font-size:12px; color:#666; margin-top:4px;">${escapeHtml(addr)}</div>
        `;
        li.style.cursor = 'pointer';
        return li;
    }

    function addMarker(position) {
        const marker = new kakao.maps.Marker({position, map});
        markers.push(marker);
        return marker;
    }

    function selectPlace(place, position) {
        const lat = position.getLat();
        const lng = position.getLng();
        const addr = place.road_address_name || place.address_name || '';

        // 단일 선택 전송값
        document.getElementById('placeName').value = place.place_name || '';
        document.getElementById('placeId').value = place.id || '';
        document.getElementById('lat').value = String(lat);
        document.getElementById('lng').value = String(lng);
        document.getElementById('address').value = addr;

        document.getElementById('pickedText').textContent =
            `${place.place_name} / ${addr} (lat=${lat.toFixed(6)}, lng=${lng.toFixed(6)})`;

        // 일정 목록에 추가
        addSchedulePlace({
            placeId: String(place.id || ''),
            placeName: String(place.place_name || ''),
            address: String(addr || ''),
            lat: Number(lat),
            lng: Number(lng)
        });
    }

    // 일정 추가 (중복 방지)
    function addSchedulePlace(item) {
        if (!item.placeName) return;

        const key = item.placeId || `${item.placeName}|${item.lat}|${item.lng}`;
        const exists = schedulePlaces.some(p => (p.placeId || `${p.placeName}|${p.lat}|${p.lng}`) === key);
        if (exists) return;

        schedulePlaces.push(item);
        renderSchedulePlaces();
    }

    // 일정 삭제
    function removeSchedulePlace(index) {
        if (index < 0 || index >= schedulePlaces.length) return;
        schedulePlaces.splice(index, 1);
        renderSchedulePlaces();
    }

    document.addEventListener('DOMContentLoaded', function () {
        // ✅ endAt 기본값: 작성 시점 + 14일 (비어있을 때만)
        presetEndAtPlus14Days();

        loadSchedulePlacesFromHidden();
        renderSchedulePlaces();
    });

    function presetEndAtPlus14Days() {
        const endEl = document.getElementById('endAt');
        if (!endEl) return;

        // 값이 이미 있으면 건드리지 않음(사용자 선택/서버 기본값 보호)
        if (endEl.value && endEl.value.trim().length > 0) return;

        const d = new Date();
        d.setDate(d.getDate() + 14);
        endEl.value = toDatetimeLocalValue(d);
    }

    function toDatetimeLocalValue(date) {
        const pad = (n) => String(n).padStart(2, '0');
        const yyyy = date.getFullYear();
        const mm = pad(date.getMonth() + 1);
        const dd = pad(date.getDate());
        const hh = pad(date.getHours());
        const mi = pad(date.getMinutes());
        return `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
    }

    function loadSchedulePlacesFromHidden() {
        const hiddenRoot = document.getElementById('scheduleHiddenFieldsServer');
        if (!hiddenRoot) return;

        const placeNameInputs = hiddenRoot.querySelectorAll('input[name^="schedulePlaces["][name$=".placeName"]');
        if (!placeNameInputs || placeNameInputs.length === 0) return;

        schedulePlaces = [];

        for (let i = 0; i < placeNameInputs.length; i++) {
            const base = `schedulePlaces[${i}]`;

            const placeId = hiddenRoot.querySelector(`input[name="${base}.placeId"]`)?.value ?? '';
            const placeName = hiddenRoot.querySelector(`input[name="${base}.placeName"]`)?.value ?? '';
            const address = hiddenRoot.querySelector(`input[name="${base}.address"]`)?.value ?? '';
            const latStr = hiddenRoot.querySelector(`input[name="${base}.lat"]`)?.value ?? '';
            const lngStr = hiddenRoot.querySelector(`input[name="${base}.lng"]`)?.value ?? '';

            if (!placeName) continue;

            const lat = latStr !== '' ? Number(latStr) : null;
            const lng = lngStr !== '' ? Number(lngStr) : null;

            schedulePlaces.push({
                placeId,
                placeName,
                address,
                lat: Number.isFinite(lat) ? lat : null,
                lng: Number.isFinite(lng) ? lng : null
            });
        }
    }

    function renderSchedulePlaces() {
        const listEl = document.getElementById('scheduleList');
        const hiddenEl = document.getElementById('scheduleHiddenFields');

        listEl.innerHTML = '';
        hiddenEl.innerHTML = '';

        if (!schedulePlaces || schedulePlaces.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.id = 'scheduleEmptyText';
            emptyDiv.style.color = '#888';
            emptyDiv.style.fontSize = '13px';
            emptyDiv.textContent = '아직 추가된 일정이 없습니다. 지도에서 장소를 클릭해 추가해 주세요.';
            listEl.appendChild(emptyDiv);
            return;
        }

        schedulePlaces.forEach((p, idx) => {
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.gap = '10px';
            row.style.alignItems = 'center';
            row.style.justifyContent = 'space-between';
            row.style.padding = '10px';

            const left = document.createElement('div');
            left.style.display = 'flex';
            left.style.flexDirection = 'column';
            left.style.gap = '4px';

            const title = document.createElement('div');
            title.style.fontWeight = 'bold';
            title.textContent = `${p.placeName} | ${p.address}`;
            left.appendChild(title);

            if (p.lat != null && p.lng != null && Number.isFinite(p.lat) && Number.isFinite(p.lng)) {
                const sub = document.createElement('div');
                sub.style.fontSize = '12px';
                sub.style.color = '#666';
                sub.textContent = `(lat=${p.lat.toFixed(6)}, lng=${p.lng.toFixed(6)})`;
                left.appendChild(sub);
            }

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = '삭제';
            btn.style.padding = '6px 10px';
            btn.style.cursor = 'pointer';
            btn.onclick = () => removeSchedulePlace(idx);

            row.appendChild(left);
            row.appendChild(btn);
            listEl.appendChild(row);

            hiddenEl.appendChild(makeHidden(`schedulePlaces[${idx}].placeId`, p.placeId));
            hiddenEl.appendChild(makeHidden(`schedulePlaces[${idx}].placeName`, p.placeName));
            hiddenEl.appendChild(makeHidden(`schedulePlaces[${idx}].address`, p.address));
            hiddenEl.appendChild(makeHidden(`schedulePlaces[${idx}].lat`, p.lat == null ? '' : String(p.lat)));
            hiddenEl.appendChild(makeHidden(`schedulePlaces[${idx}].lng`, p.lng == null ? '' : String(p.lng)));
        });
    }

    function makeHidden(name, value) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value ?? '';
        return input;
    }

    function displayPagination(pagination) {
        const paginationEl = document.getElementById('pagination');
        paginationEl.innerHTML = '';

        for (let i = 1; i <= pagination.last; i++) {
            const a = document.createElement('a');
            a.href = '#';
            a.textContent = i;
            a.onclick = (function (i) {
                return function () {
                    pagination.gotoPage(i);
                    return false;
                }
            })(i);

            paginationEl.appendChild(a);
        }
    }

    function clearMarkers() {
        markers.forEach(m => m.setMap(null));
        markers = [];
    }

    function clearResults() {
        clearMarkers();
        document.getElementById('placesList').innerHTML = '';
        document.getElementById('pagination').innerHTML = '';
    }

    function escapeHtml(s) {
        return String(s)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script th:src="@{/js/footer.js(v=${#dates.createNow().time})}"></script>

</body>
</html>
