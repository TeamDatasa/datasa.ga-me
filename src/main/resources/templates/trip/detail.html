<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여행 글 상세</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .row { margin: 10px 0; }
        .label { font-weight: bold; display:inline-block; width: 140px; }
        .box { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; }
        a { text-decoration: none; }

        /* ✅ 좋아요 UI */
        .title-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .like-btn {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 999px;
            padding: 6px 12px;
            cursor: pointer;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .like-btn[data-liked="false"] .heart { color: #777; }
        .like-btn[data-liked="true"]  .heart { color: #e0245e; }
        .heart { font-size: 18px; line-height: 1; }
        .like-count { font-size: 13px; color: #333; min-width: 16px; text-align:right; }

        /* ===== 댓글 UI ===== */
        .comment-wrap { margin-top: 24px; }
        .comment-header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .comment-header .hint { color:#666; font-size: 13px; }
        .comment-form { border:1px solid #eee; border-radius:10px; padding:12px; margin-top:12px; background:#fafafa; }
        .comment-form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .comment-form input[type="number"] { width:140px; padding:8px; }
        .comment-form textarea { width:100%; min-height:80px; padding:10px; resize: vertical; margin-top:10px; }
        .comment-form button { padding:8px 12px; cursor:pointer; }

        .comment-list { margin-top: 16px; display:flex; flex-direction:column; gap:10px; }
        .comment-item { border:1px solid #eee; border-radius:10px; padding:12px; }
        .comment-item.reply { margin-left: 28px; border-left: 4px solid #f0f0f0; }
        .comment-meta { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
        .comment-meta .left { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .badge { font-size:12px; padding:3px 8px; border-radius:999px; background:#f3f3f3; color:#555; }
        .comment-content { margin-top:8px; white-space:pre-wrap; line-height:1.45; }
        .comment-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
        .comment-actions button { padding:6px 10px; cursor:pointer; }
        .muted { color:#777; font-size: 13px; }
        .danger { color:#b00020; }
        .small { font-size: 12px; color:#666; }
        .hidden { display:none !important; }
        .edit-area { width:100%; min-height:70px; padding:10px; resize: vertical; margin-top:10px; }
    </style>
</head>
<body>

<div class="title-bar">
    <h1 style="margin:0;">여행 글 상세</h1>

    <!-- ✅ 좋아요 버튼 -->
    <button type="button"
            id="likeBtn"
            class="like-btn"
            th:attr="data-trip-id=${trip.tripId}, data-liked=${trip.likedByMe}">
        <span class="heart" th:text="${trip.likedByMe} ? '❤' : '♡'">♡</span>
        <span class="like-count" id="likeCount" th:text="${trip.likeCount}">0</span>
    </button>
</div>

<div class="row"><span class="label">글 ID</span><span th:text="${trip.tripId}">-</span></div>
<div class="row"><span class="label">제목</span><span th:text="${trip.title}">-</span></div>

<div class="row"><span class="label">호스트</span>
    <span th:text="${trip.hostUser != null ? trip.hostUser.name : '-'}">-</span>
</div>

<div class="row"><span class="label">테마</span><span th:text="${trip.theme}">-</span></div>
<div class="row"><span class="label">상태</span><span th:text="${trip.status}">-</span></div>

<div class="row"><span class="label">예상 비용</span>
    <span th:text="${trip.estimatedCost != null ? trip.estimatedCost : '-'}">-</span>
</div>

<div class="row"><span class="label">최대 인원</span><span th:text="${trip.maxParticipants}">-</span></div>
<div class="row"><span class="label">소요 시간(분)</span><span th:text="${trip.durationMinutes}">-</span></div>

<div class="row"><span class="label">시작</span>
    <span th:text="${#temporals.format(trip.startAt, 'yyyy-MM-dd HH:mm')}">-</span>
</div>

<div class="row"><span class="label">종료</span>
    <span th:text="${#temporals.format(trip.endAt, 'yyyy-MM-dd HH:mm')}">-</span>
</div>

<div class="row"><span class="label">작성일</span>
    <span th:text="${trip.createdAt != null ? #temporals.format(trip.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
</div>

<div class="row"><span class="label">수정일</span>
    <span th:text="${trip.updatedAt != null ? #temporals.format(trip.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
</div>

<div class="row"><span class="label">수정 제한(일)</span>
    <span th:text="${trip.editLockDays}">-</span>
</div>

<div class="box">
    <div class="label">설명</div>
    <div th:text="${trip.description}">-</div>
</div>

<!-- ===== 일정(장소) 표시 ===== -->
<div class="box" style="margin-top:14px;">
    <div class="label">일정(장소)</div>
    <div th:if="${trip.locations == null or #lists.isEmpty(trip.locations)}" class="muted">
        등록된 장소가 없습니다.
    </div>

    <div th:if="${trip.locations != null and !#lists.isEmpty(trip.locations)}">
        <ul style="list-style:none; padding:0; margin:10px 0 0 0; display:flex; flex-direction:column; gap:10px;">
            <li th:each="loc : ${trip.locations}"
                style="border:1px solid #eee; border-radius:10px; padding:10px;">
                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <span class="badge" th:text="${loc.orderNo}">1</span>
                    <span style="font-weight:bold;" th:text="${loc.placeName}">장소명</span>
                </div>
                <div style="margin-top:6px; color:#666; font-size:13px;" th:text="${loc.address}">주소</div>
                <div class="small" style="margin-top:6px;" th:if="${loc.lat != null and loc.lng != null}">
                    <span th:text="'lat=' + ${#numbers.formatDecimal(loc.lat, 1, 'POINT', 6, 'NONE')}"></span>
                    <span th:text="', lng=' + ${#numbers.formatDecimal(loc.lng, 1, 'POINT', 6, 'NONE')}"></span>
                </div>
            </li>
        </ul>
    </div>
</div>

<br/>

<a th:href="@{/api/trip/listAll}">목록으로</a>
&nbsp;|&nbsp;
<a th:href="@{/api/trip/update/{id}(id=${trip.tripId})}">수정</a>

<form th:action="@{/api/trip/delete/{id}(id=${trip.tripId})}" method="post"
      onsubmit="return confirm('정말 삭제하시겠습니까?');"
      style="display:inline;">
    <button type="submit">삭제</button>
</form>

<!-- ===== 댓글 영역 추가 ===== -->
<hr style="margin:24px 0;"/>

<div class="comment-wrap">
    <div class="comment-header">
        <div>
            <h2 style="margin:0;">댓글</h2>
            <div class="hint">로그인이 없으므로 userId(1~10)를 더미로 입력해서 테스트합니다.</div>
        </div>
        <div class="small" id="commentCountText"></div>
    </div>

    <div class="comment-form">
        <div class="comment-form-row">
            <label class="muted" for="dummyUserId">userId</label>
            <input id="dummyUserId" type="number" min="1" max="10" value="1" />
            <span class="muted" id="replyTargetText">최상위 댓글 작성</span>
            <button type="button" id="cancelReplyBtn" class="hidden">대댓글 취소</button>
        </div>

        <input type="hidden" id="parentCommentId" value="" />
        <textarea id="commentContent" placeholder="댓글 내용을 입력하세요"></textarea>

        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" id="submitCommentBtn">댓글 등록</button>
            <span class="muted" id="formMsg"></span>
        </div>
    </div>

    <div class="comment-list" id="commentList"></div>
</div>

<script th:inline="javascript">
    const tripId = [[${trip.tripId}]];
</script>

<script>
    // ✅ 좋아요 토글
    const likeBtn = document.getElementById("likeBtn");
    const likeCountEl = document.getElementById("likeCount");

    likeBtn.addEventListener("click", async () => {
        const id = likeBtn.getAttribute("data-trip-id");
        likeBtn.disabled = true;

        try {
            const res = await fetch(`/api/trip/${id}/like`, {
                method: "POST",
                headers: { "Accept": "application/json" }
            });
            if (!res.ok) throw new Error(res.status);

            const data = await res.json(); // {liked:boolean, count:number}
            likeBtn.setAttribute("data-liked", String(data.liked));
            likeBtn.querySelector(".heart").innerText = data.liked ? "❤" : "♡";
            likeCountEl.innerText = data.count;
        } finally {
            likeBtn.disabled = false;
        }
    });
</script>

<script>
    const elUserId = document.getElementById('dummyUserId');
    const elParentId = document.getElementById('parentCommentId');
    const elContent = document.getElementById('commentContent');
    const elList = document.getElementById('commentList');
    const elFormMsg = document.getElementById('formMsg');
    const elReplyTargetText = document.getElementById('replyTargetText');
    const elCancelReplyBtn = document.getElementById('cancelReplyBtn');
    const elCountText = document.getElementById('commentCountText');

    document.getElementById('submitCommentBtn').addEventListener('click', submitComment);
    elCancelReplyBtn.addEventListener('click', () => setReplyTarget(null));

    function getUserId() {
        const v = Number(elUserId.value);
        if (!Number.isInteger(v) || v < 1 || v > 10) return null;
        return v;
    }

    function showMsg(msg, isError = false) {
        elFormMsg.textContent = msg || '';
        elFormMsg.className = isError ? 'danger' : 'muted';
    }

    function setReplyTarget(parentId) {
        if (parentId == null) {
            elParentId.value = '';
            elReplyTargetText.textContent = '최상위 댓글 작성';
            elCancelReplyBtn.classList.add('hidden');
        } else {
            elParentId.value = String(parentId);
            elReplyTargetText.textContent = `대댓글 작성 (부모댓글 ID: ${parentId})`;
            elCancelReplyBtn.classList.remove('hidden');
        }
    }

    async function loadComments() {
        elList.innerHTML = '';
        elCountText.textContent = '';

        try {
            const res = await fetch(`/api/trips/${tripId}/comments`, { method: 'GET' });
            if (!res.ok) throw new Error(`목록 조회 실패 (${res.status})`);
            const items = await res.json();

            elCountText.textContent = `총 ${items.length}개`;
            renderThread(items);
        } catch (e) {
            elList.innerHTML = `<div class="danger">댓글 목록을 불러오지 못했습니다. (${escapeHtml(e.message)})</div>`;
        }
    }

    function renderThread(items) {
        const byParent = new Map();
        for (const c of items) {
            const key = (c.parentCommentId == null) ? null : c.parentCommentId;
            if (!byParent.has(key)) byParent.set(key, []);
            byParent.get(key).push(c);
        }

        const roots = byParent.get(null) || [];
        const frag = document.createDocumentFragment();
        roots.forEach(root => {
            frag.appendChild(renderCommentNode(root, byParent, 0));
        });
        elList.appendChild(frag);
    }

    function renderCommentNode(c, byParent, depth) {
        const div = document.createElement('div');
        div.className = 'comment-item' + (depth > 0 ? ' reply' : '');
        div.dataset.commentId = c.commentId;

        const meta = document.createElement('div');
        meta.className = 'comment-meta';

        const left = document.createElement('div');
        left.className = 'left';
        left.innerHTML = `
          <span class="badge">ID: ${c.commentId}</span>
          <span class="badge">userId: ${c.userId}</span>
          <span class="small">${escapeHtml(c.createdAt || '')}</span>
        `;

        const right = document.createElement('div');
        right.className = 'small';
        right.textContent = c.updatedAt ? `수정: ${c.updatedAt}` : '';

        meta.appendChild(left);
        meta.appendChild(right);

        const content = document.createElement('div');
        content.className = 'comment-content';
        content.textContent = c.content || '';

        const actions = document.createElement('div');
        actions.className = 'comment-actions';

        const btnReply = document.createElement('button');
        btnReply.type = 'button';
        btnReply.textContent = '대댓글';
        btnReply.onclick = () => setReplyTarget(c.commentId);

        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.textContent = '수정';
        btnEdit.onclick = () => openEdit(div, c);

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.textContent = '삭제';
        btnDel.onclick = () => deleteComment(c.commentId);

        actions.appendChild(btnReply);
        actions.appendChild(btnEdit);
        actions.appendChild(btnDel);

        div.appendChild(meta);
        div.appendChild(content);
        div.appendChild(actions);

        const children = byParent.get(c.commentId) || [];
        children.forEach(ch => div.appendChild(renderCommentNode(ch, byParent, depth + 1)));

        return div;
    }

    async function submitComment() {
        const userId = getUserId();
        if (!userId) return showMsg('userId는 1~10 숫자만 가능합니다.', true);

        const content = elContent.value.trim();
        if (!content) return showMsg('내용을 입력하세요.', true);

        const parent = elParentId.value ? Number(elParentId.value) : null;

        showMsg('등록 중...');
        try {
            const res = await fetch(`/api/trips/${tripId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, content, parentCommentId: parent })
            });
            if (!res.ok) throw new Error(`등록 실패 (${res.status})`);

            elContent.value = '';
            setReplyTarget(null);
            showMsg('등록 완료');
            await loadComments();
        } catch (e) {
            showMsg(e.message, true);
        }
    }

    function openEdit(container, c) {
        const old = container.querySelector('.comment-content');
        const actions = container.querySelector('.comment-actions');
        if (!old || !actions) return;

        if (container.querySelector('textarea.edit-area')) return;

        const ta = document.createElement('textarea');
        ta.className = 'edit-area';
        ta.value = c.content || '';

        const btnSave = document.createElement('button');
        btnSave.type = 'button';
        btnSave.textContent = '저장';
        btnSave.onclick = () => updateComment(c.commentId, ta.value);

        const btnCancel = document.createElement('button');
        btnCancel.type = 'button';
        btnCancel.textContent = '취소';
        btnCancel.onclick = () => {
            ta.remove();
            btnSave.remove();
            btnCancel.remove();
        };

        old.after(ta);
        actions.appendChild(btnSave);
        actions.appendChild(btnCancel);
    }

    async function updateComment(commentId, content) {
        const userId = getUserId();
        if (!userId) return showMsg('userId는 1~10 숫자만 가능합니다.', true);

        const v = (content || '').trim();
        if (!v) return showMsg('내용이 비었습니다.', true);

        showMsg('수정 중...');
        try {
            const res = await fetch(`/api/trips/${tripId}/comments/${commentId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, content: v })
            });
            if (!res.ok) throw new Error(`수정 실패 (${res.status})`);

            showMsg('수정 완료');
            await loadComments();
        } catch (e) {
            showMsg(e.message, true);
        }
    }

    async function deleteComment(commentId) {
        const userId = getUserId();
        if (!userId) return showMsg('userId는 1~10 숫자만 가능합니다.', true);
        if (!confirm('삭제하시겠습니까?')) return;

        showMsg('삭제 중...');
        try {
            const res = await fetch(`/api/trips/${tripId}/comments/${commentId}?userId=${userId}`, {
                method: 'DELETE'
            });
            if (!res.ok) throw new Error(`삭제 실패 (${res.status})`);

            showMsg('삭제 완료');
            await loadComments();
        } catch (e) {
            showMsg(e.message, true);
        }
    }

    function escapeHtml(s) {
        return String(s)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    loadComments();
</script>

</body>
</html>
