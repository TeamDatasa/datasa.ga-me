<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/detail.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">

    <title>여행 글 상세</title>
</head>

<body>

<header class="yw-header">
    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <nav class="yw-nav">
            <a class="yw-nav__link" href="/">홈</a>
            <a class="yw-nav__link" href="/listAll">여행</a>
            <a class="yw-nav__link" href="/community">고객센터</a>
        </nav>

        <div class="yw-auth">
            <div id="guestMenu">
                <a class="yw-btn yw-btn--ghost" th:href="@{/login}">로그인</a>
                <a class="yw-btn yw-btn--primary" th:href="@{/signup}">회원가입</a>
            </div>

            <div id="userMenu" style="display:none;">
                <div th:replace="~{fragments/topbar :: notifTopbar}"></div>
                <a class="yw-btn yw-btn--ghost" th:href="@{/mypage}">마이페이지</a>
                <button class="yw-btn yw-btn--primary" id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <div class="container">

        <header class="post-header">
            <h1 th:text="${trip.title}">제목</h1>
        </header>

        <section class="post-body">
            <p th:text="${trip.description}">본문</p>
        </section>

        <section class="comments">
            <div class="comments-head">
                <h2 class="section-title">댓글</h2>
                <span class="muted small" id="commentCount">0</span>
            </div>

            <form id="commentForm" class="comment-form">
                <textarea id="commentContent"
                          class="textarea"
                          rows="3"
                          placeholder="댓글을 입력하세요"></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn primary">등록</button>
                </div>
            </form>

            <ul id="commentList" class="comment-list"></ul>
        </section>

    </div>
</main>

<script th:inline="javascript">
    const tripId = /*[[${trip.tripId}]]*/ 0;
</script>

<script th:src="@{/js/authFetch.js}"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("commentForm");
        const contentEl = document.getElementById("commentContent");
        const listEl = document.getElementById("commentList");
        const countEl = document.getElementById("commentCount");

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        async function loadComments() {
            const res = await authFetch(`/api/trips/${tripId}/comments`, { method: "GET" });
            if (!res.ok) return;

            const data = await res.json();
            countEl.textContent = data.length;

            listEl.innerHTML = "";

            data.forEach(c => {
                const li = document.createElement("li");
                li.className = "comment-item";
                li.innerHTML = `
                  <div class="comment-head">
                    <span class="comment-author">${escapeHtml(c.userName)}</span>
                    <span class="comment-date">${new Date(c.createdAt).toLocaleString()}</span>
                  </div>
                  <div class="comment-body">${escapeHtml(c.content)}</div>
                `;

                // ✅ 빠진 부분: 실제로 DOM에 추가해야 화면에 보입니다.
                listEl.appendChild(li);
            });
        }

        form.addEventListener("submit", async e => {
            e.preventDefault();

            const content = contentEl.value.trim();
            if (!content) return;

            const res = await authFetch(`/api/trips/${tripId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    parentCommentId: null,
                    content
                })
            });

            if (!res.ok) {
                alert("댓글 등록에 실패했습니다.");
                return;
            }

            contentEl.value = "";
            await loadComments();
        });

        loadComments();
    });
</script>

<script th:src="@{/js/main-auth.js}"></script>
<script th:src="@{/js/notifications.js}"></script>

</body>
</html>
