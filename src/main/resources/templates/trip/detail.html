<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/detail.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <link rel="stylesheet" th:href="@{/css/trip-apply.css(v=${#dates.createNow().time})}">

    <title>여행 글 상세</title>
</head>

<body>

<header class="yw-header">
    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <nav class="yw-nav">
            <a class="yw-nav__link" href="/">홈</a>
            <a class="yw-nav__link" href="/listAll">여행</a>
            <a class="yw-nav__link" href="/community">고객센터</a>
        </nav>

        <div class="yw-auth">
            <div id="guestMenu">
                <a class="yw-btn yw-btn--ghost" th:href="@{/login}">로그인</a>
                <a class="yw-btn yw-btn--primary" th:href="@{/signup}">회원가입</a>
            </div>

            <div id="userMenu" style="display:none;">
                <div th:replace="~{fragments/topbar :: notifTopbar}"></div>
                <a class="yw-btn yw-btn--ghost" th:href="@{/mypage}">마이페이지</a>
                <button class="yw-btn yw-btn--primary" id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <div class="container">

        <header class="post-header">
            <h1 th:text="${trip.title}">제목</h1>
        </header>

        <section class="post-body">
            <p th:text="${trip.description}">본문</p>
        </section>

        <!-- ✅ 여정 신청 버튼 -->
        <section class="trip-apply-section">
            <button type="button" id="applyBtn" class="btn primary btn-apply" style="width:100%;">
                여정 신청하기
            </button>
        </section>

        <section class="comments">
            <div class="comments-head">
                <h2 class="section-title">댓글</h2>
                <span class="muted small" id="commentCount">0</span>
            </div>

            <form id="commentForm" class="comment-form">
                <textarea id="commentContent"
                          class="textarea"
                          rows="3"
                          placeholder="댓글을 입력하세요"></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn primary">등록</button>
                </div>
            </form>

            <ul id="commentList" class="comment-list"></ul>
        </section>

    </div>
</main>

<!-- ✅ Thymeleaf 변수 주입 (중요) -->
<script th:inline="javascript">
    const tripId = /*[[${trip.tripId}]]*/ 0;
    const hostUserId = /*[[${trip.hostUserId}]]*/ 0;      // TripDetailResponse에 getHostUserId() 있어야 함
    const currentUserId = /*[[${currentUserId}]]*/ null;
</script>

<script th:src="@{/js/authFetch.js}"></script>
<script th:src="@{/js/trip-apply.js(v=${#dates.createNow().time})}"></script>

<script th:src="@{/js/main-auth.js}"></script>
<script th:src="@{/js/notifications.js}"></script>

</body>
</html>
