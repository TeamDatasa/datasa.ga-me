<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" th:href="@{/css/main.css}">

    <!-- 기존: 상세 페이지 스타일 -->
    <link rel="stylesheet" th:href="@{/css/detail.css(v=${#dates.createNow().time})}"/>

    <link rel="stylesheet" th:href="@{/css/notifications.css}">

    <title>여행 글 상세</title>
</head>

<body>

<header class="yw-header">
    <div class="yw-container yw-header__inner">
        <a class="yw-logo" href="/">
            <span class="yw-logo__mark">●</span>
            <span class="yw-logo__text">ga-me</span>
        </a>

        <nav class="yw-nav">
            <a class="yw-nav__link" href="/">홈</a>
            <a class="yw-nav__link" href="/courses">코스</a>
            <a class="yw-nav__link" href="/guides">가이드</a>
            <a class="yw-nav__link" href="/community">커뮤니티</a>
        </nav>

        <div class="yw-auth">
            <!-- 비로그인 -->
            <div id="guestMenu">
                <a class="yw-btn yw-btn--ghost" th:href="@{/login}">로그인</a>
                <a class="yw-btn yw-btn--primary" th:href="@{/signup}">회원가입</a>
            </div>

            <!-- 로그인 -->
            <div id="userMenu" style="display:none;">
                <div th:replace="~{fragments/topbar :: notifTopbar}"></div>

                <a class="yw-btn yw-btn--ghost" th:href="@{/mypage}">마이페이지</a>
                <button class="yw-btn yw-btn--primary" type="button" id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <div class="container">

        <div class="top-actions">
            <a class="back-link" th:href="@{/api/trip/listAll}" aria-label="목록으로">←</a>
        </div>

        <header class="post-header">
            <div class="post-title-row">
                <h1 class="post-title" th:text="${trip.title}">제목</h1>

                <button type="button"
                        id="likeBtn"
                        class="like-btn"
                        th:attr="data-trip-id=${trip.tripId}, data-liked=${trip.likedByMe}">
                    <span class="heart" th:text="${trip.likedByMe} ? '❤' : '♡'">♡</span>
                    <span class="like-count" id="likeCount" th:text="${trip.likeCount}">0</span>
                </button>
            </div>

            <div class="post-meta">
                <div class="meta-left">
                    <span class="chip" th:text="${trip.hostName}">작성자</span>
                    <span class="dot">•</span>
                    <span class="muted" th:text="${#temporals.format(trip.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                </div>

                <div class="meta-right" style="display:none;"></div>
            </div>
        </header>

        <section class="post-body">
            <p class="content" th:text="${trip.description}">본문</p>
        </section>

        <section class="comments">
            <div class="comments-head">
                <h2 class="section-title">댓글</h2>
                <span class="muted small" id="commentCount">0</span>
            </div>

            <form id="commentForm" class="comment-form">
                <input type="hidden" id="userId" th:value="${userId}"/>
                <input type="hidden" id="tripId" th:value="${trip.tripId}"/>

                <textarea id="commentContent"
                          class="textarea"
                          rows="3"
                          placeholder="댓글을 입력하세요"></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn primary">등록</button>
                </div>
            </form>

            <ul id="commentList" class="comment-list"></ul>
        </section>

        <footer class="bottom-actions">
            <a class="btn" th:href="@{/api/trip/listAll}">목록</a>

            <a class="btn" th:if="${isMine}" th:href="@{'/api/trip/update/' + ${trip.tripId}}">수정</a>

            <button class="btn danger"
                    type="button"
                    th:if="${isMine}"
                    th:attr="data-trip-id=${trip.tripId}"
                    id="deleteBtn">삭제
            </button>
        </footer>

    </div>
</main>

<script th:inline="javascript">
    const tripId = /*[[${trip.tripId}]]*/ 0;
    const currentUserId = /*[[${userId}]]*/ null;
    const isLogin = /*[[${isLogin}]]*/ false;
</script>

<script>
    const likeBtn = document.getElementById("likeBtn");
    const likeCountEl = document.getElementById("likeCount");

    likeBtn?.addEventListener("click", async () => {
        if (!isLogin) {
            alert("로그인이 필요합니다.");
            return;
        }

        const tripId = likeBtn.dataset.tripId;

        try {
            const res = await fetch(`/api/trips/${tripId}/like`, {
                method: "POST",
                credentials: "same-origin",
            });

            if (!res.ok) {
                alert("처리에 실패했습니다.");
                return;
            }

            const data = await res.json();
            likeBtn.dataset.liked = data.liked;
            likeCountEl.textContent = data.likeCount;
            likeBtn.querySelector(".heart").textContent = data.liked ? "❤" : "♡";
        } catch (e) {
            alert("네트워크 오류");
        }
    });
</script>

<script th:src="@{/js/main-auth.js}"></script>

<script th:src="@{/js/notifications.js}"></script>

</body>
</html>
