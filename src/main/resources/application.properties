spring.application.name=Ga-me

#port number
server.port=8080

#Context Path
server.servlet.context-path= /

#Log level
#error>warn>info>debug>trace
logging.level.root=info
logging.level.org.springframework.security=DEBUG

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/???????useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.url=jdbc:mysql://localhost:3306/Game

spring.datasource.username=root
spring.datasource.password=root


spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

jwt.secret=please_change_this_to_a_long_random_secret_key_32_chars_plus
jwt.validity-ms=3600000

# naver api
naver.maps.client-id=${NAVER_MAPS_CLIENT_ID}
naver.maps.client-secret=${NAVER_MAPS_CLIENT_SECRET:}

naver.search.client-id=${NAVER_SEARCH_CLIENT_ID}
naver.search.client-secret=${NAVER_SEARCH_CLIENT_SECRET}

# kakao api
kakao.maps.js-key=${KAKAO_MAPS_JS_KEY}

